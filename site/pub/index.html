<!-- FRQTL SDK showcase — the full-screen PLAYER, and the WALK-THROUGH gallery.

     Authored at sdk/frqtl-sdk/src/index.html; written to dist/index.html by
     sdk/frqtl-sdk/build.js (build is the sole writer of dist/), which splices the lib/ module
     placements (sdk/frqtl-sdk/scripts/lib-dist-placement.js) into the import map below. The page
     imports every lib/ module by its lib/ identity (`lib/shim/…`, `lib/components/…`,
     `lib/frqtl/experiments/…`) and never types a dist path.

     PLAYER (a deep link — what a front-page card opens):
       ?rung=<id>[&mode=<id>]   a walk-through rung, played in THIS page by bootRecipe.
       ?experiment=<id>         a canonical experiment page, NAVIGATED to after the card
                                (experiments/<id>/index.html?engine=wasm, via the router; no iframe).
     No editor chrome: the side columns are hidden and the canvas fills the viewport (display-only
     CSS; the world size runner.canvas_rect is the scene's own). A run-once card comes first
     (lib/components/run-once-card; content from lib/frqtl/experiments/exhibits.js showcaseCard —
     the showcase roster row's title / what / why and the Move-and-Look paragraph on a 3D scene).
     A scene with no roster row plays with NO card (recorded: not-offered-no-roster-row). Seen-state goes through the storage seam, installed by bootLocalStorage() and
     recorded on <html> by recordStorageBoot. A rung boots behind the card and is HELD with the
     runner's own stop() until Continue, then start()ed; a second visit skips the card.

     GALLERY (no deep link): the WALK-THROUGH registry's rungs in a nav, each booted in place —
     the list, titles, prose, groups, modes and default are READ FROM THE REGISTRY at runtime; an
     unknown ?rung= / ?experiment= FAILS LOUD with a named error.

     HOW A RUNG RUNS: `bootRecipe` (dist/esm/index.js) boots the rung's `source` with the rung's
     `effectiveRenderState` bag, using a PAGE-RELATIVE base, so every engine/renderer/game script
     loads from the dist this page is served out of. The mount div is deliberately
     id="canvas-wrapper": that is the id a rung's `CameraControls.attach` line looks up, so the 3D
     rungs' MOVE/LOOK joysticks mount here (CameraControls is the one pad authority). -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EGPT FRQTL — Emergent Physics from Cellular Automata</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        /* ── Reset ───────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #c8cdd0; }

        /* ── Three-Panel Layout ──────────────────────────── */
        .app { display: flex; height: 100vh; }

        /* ── Left Nav ────────────────────────────────────── */
        .left-nav {
            width: 260px; min-width: 260px;
            background: #111; border-right: 1px solid #222;
            display: flex; flex-direction: column;
            overflow-y: auto;
        }
        .nav-brand {
            padding: 20px 16px 12px;
            border-bottom: 1px solid #222;
        }
        .nav-brand h1 {
            font-size: 1.1rem; font-weight: 700; color: #fff;
            letter-spacing: 1px; margin-bottom: 2px;
        }
        .nav-brand .tagline {
            font-size: 0.72rem; color: #666; line-height: 1.3;
        }
        .nav-section-title {
            padding: 16px 16px 6px; font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px; color: #555;
        }
        .nav-link-item {
            display: block; padding: 10px 16px 10px 20px;
            color: #999; font-size: 0.85rem; cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            text-decoration: none;
        }
        .nav-link-item:hover { background: #1a1a1a; color: #ddd; }
        .nav-link-item.active {
            background: #b6161c; color: #fff;
            border-left-color: #fff;
        }
        .nav-divider { border-top: 1px solid #222; margin: 8px 0; }
        .nav-link-item.sdk-link {
            color: #4a9eff; font-weight: 600;
        }
        .nav-link-item.sdk-link:hover { color: #6db3ff; background: #0d1b2a; }
        .nav-footer {
            margin-top: auto; padding: 12px 16px; border-top: 1px solid #222;
            font-size: 0.65rem; color: #444; line-height: 1.4;
        }

        /* ── Center: Simulation Player ───────────────────── */
        .center-panel {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; position: relative; overflow: hidden;
        }
        /* The mount box is the 600x400 stage on a desktop and SHRINKS to the panel on a
           phone (portrait or landscape); the canvas inside letterboxes into it with
           object-fit:contain. DISPLAY-ONLY: the world size (runner.canvas_rect) is the
           rung's own and is never touched. The MOVE/LOOK pads of a 3D rung anchor to this
           box's bottom corners, so a box that fits the screen puts both pads in reach.
           The status line below keeps its height (max-height reserves it). */
        #canvas-wrapper {
            position: relative; width: 600px; height: 400px;
            max-width: 100%; max-height: calc(100% - 40px);
        }
        #canvas-wrapper > [data-role="frqtl-recipe-canvas"] {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        #canvas-wrapper canvas {
            max-width: 100%; max-height: 100%;
            object-fit: contain; object-position: center;
        }
        .center-status {
            font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
            color: #777; padding: 8px 0 12px;
        }

        /* ── Right: Description Panel ────────────────────── */
        .right-panel {
            width: 320px; min-width: 280px;
            background: #111; border-left: 1px solid #222;
            overflow-y: auto; padding: 24px 20px;
        }
        .desc-label {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: #555; margin-bottom: 4px;
        }
        .desc-title {
            font-size: 1.2rem; font-weight: 700; color: #fff;
            margin-bottom: 2px; line-height: 1.3;
        }
        .desc-subtitle {
            font-size: 0.8rem; color: #888; margin-bottom: 16px;
            font-style: italic;
        }
        .desc-description {
            font-size: 0.88rem; color: #999; line-height: 1.65;
            margin-bottom: 18px;
        }
        .desc-section-title {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px;
            color: #666; margin-bottom: 8px; margin-top: 18px;
            padding-bottom: 4px; border-bottom: 1px solid #1e1e1e;
        }
        .desc-reproduce {
            background: #0d0d0d; border: 1px solid #252525;
            border-radius: 4px; padding: 10px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem; color: #7ec8e3;
            word-break: break-all; line-height: 1.5;
            margin-bottom: 4px; white-space: pre-wrap;
        }
        .mode-row { margin-bottom: 6px; }
        .mode-btn {
            display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px;
            font-size: 0.75rem; color: #9ab; background: #16222f;
            border: 1px solid #24384c; border-radius: 3px; cursor: pointer;
        }
        .mode-btn.active { background: #b6161c; border-color: #fff; color: #fff; }

        /* ── PLAYER mode (a deep link) ───────────────────── */
        /* No editor chrome: the side columns go and the scene takes the whole viewport, portrait
           or landscape. DISPLAY-ONLY: the canvas element fills the box and its bitmap letterboxes
           (object-fit:contain); the world (runner.canvas_rect) is untouched. !important because a
           renderer writes the canvas's own inline width/height, and the player box must win. */
        html[data-player="on"] .left-nav, html[data-player="on"] .right-panel { display: none; }
        html[data-player="on"] .center-panel { position: fixed; inset: 0; }
        html[data-player="on"] #canvas-wrapper {
            width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none;
        }
        html[data-player="on"] #canvas-wrapper canvas {
            width: 100% !important; height: 100% !important; max-width: none; max-height: none;
        }
        html[data-player="on"] .center-status {
            position: absolute; top: 0; left: 0; padding: 6px 10px; pointer-events: none;
            background: rgba(0,0,0,0.45);
        }
        /* The run-once card's host covers the scene (and the pads) until Continue. */
        #player-card-host { position: absolute; inset: 0; z-index: 100; pointer-events: none; }

        /* ── FAIL-LOUD panel ─────────────────────────────── */
        .fail-loud {
            position: absolute; inset: 0; z-index: 9999; padding: 18px;
            overflow: auto; white-space: pre-wrap; background: #1a0000;
            color: #ff6b6b; border: 2px solid #b6161c;
            font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        }

        /* ── Responsive ──────────────────────────────────── */
        @media (max-width: 1100px) {
            .right-panel { width: 260px; min-width: 200px; }
        }
        @media (max-width: 800px) {
            .right-panel { display: none; }
            .left-nav { width: 200px; min-width: 160px; }
        }
        @media (max-width: 600px) {
            .left-nav { display: none; }
        }
        /* a phone held in landscape: the scene gets the whole (short) screen */
        @media (max-height: 500px) {
            .left-nav, .right-panel { display: none; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- ═══ LEFT NAV (built from the WALK-THROUGH registry) ═══ -->
    <nav class="left-nav">
        <div class="nav-brand">
            <h1>EGPT FRQTL</h1>
            <div class="tagline">Emergent Physics from<br>Cellular Automata</div>
        </div>

        <div id="nav-rungs"></div>

        <div class="nav-divider"></div>

        <a class="nav-link-item sdk-link" href="sdk.html" target="_blank">
            Developer SDK Reference
        </a>

        <div class="nav-footer">
            <strong style="color:#777">@descix/frqtl-sdk</strong><br>
            No force calculations. No wave equations.<br>
            Physics emerges from local rules.
        </div>
    </nav>

    <!-- ═══ CENTER: SIMULATION ═══ -->
    <div class="center-panel" id="center-panel">
        <div id="canvas-wrapper" data-role="frqtl-rung-mount"></div>
        <div class="center-status" id="center-status" data-role="frqtl-rung-status">booting…</div>
        <div id="player-card-host" data-run-once-host=""></div>
    </div>

    <!-- ═══ RIGHT: DESCRIPTION ═══ -->
    <div class="right-panel" id="right-panel"></div>

</div>

<!-- The ESM entry resolves page-relative to this dist's own copy; build.js adds the lib/ placements. -->
<script type="importmap" data-frqtl-lib-placement>{"imports":{"@descix/frqtl-sdk":"./esm/index.js","lib/shim/":"./ide/","lib/components/":"./components/","lib/frqtl/experiments/":"./experiments/"}}</script>
<script type="module">
/* Copyright 2023-2026 by Essam Abadir */

import { bootRecipe } from '@descix/frqtl-sdk';
// The shipped WALK-THROUGH registry — the ONE authority for which rungs exist, their order,
// groups, modes, prose and the default selection.
import {
    WALKTHROUGH, walkthroughById, walkthroughGroup, walkthroughModes, defaultWalkthroughModeId,
    effectiveRenderState, FIRST_CONTACT_WALKTHROUGH_ID
} from 'lib/shim/registry/walkthrough.js';
import { engineRouter } from 'lib/shim/engine/router.js';
import { bootLocalStorage, recordStorageBoot } from 'lib/shim/storage/boot.js';
import { openRunOnceCard, recordRunOnceNotOffered } from 'lib/components/run-once-card/index.js';
import { exhibitFor, showcaseCard, showcaseCardKey } from 'lib/frqtl/experiments/exhibits.js';

// Page-relative dist root (no trailing slash — engineRouter({mode:'cdn', base}) joins
// base + '/js/...'). Every engine/renderer/game script and every experiment page re-anchors HERE.
var DIST_ROOT = new URL('.', location.href).href.replace(/\/$/, '');
var ENGINE = 'wasm';
var router = engineRouter({ mode: 'cdn', engine: ENGINE, base: DIST_ROOT });

var statusEl = document.getElementById('center-status');
var mountEl  = document.getElementById('canvas-wrapper');
var navEl    = document.getElementById('nav-rungs');
var panelEl  = document.getElementById('right-panel');
var cardHost = document.getElementById('player-card-host');

var bootToken = 0;   // guards against a stale boot resolving after a re-select (gallery)

// Storage seam: the ONE installer, its outcome recorded (never discarded) on <html>.
recordStorageBoot(document.documentElement, bootLocalStorage());

// ── FAIL-LOUD ────────────────────────────────────────────────────────────────

/** Paint a visible failure over the canvas area. */
function failLoud(title, detail) {
    var box = document.createElement('div');
    box.className = 'fail-loud';
    box.setAttribute('data-role', 'rung-error');
    box.textContent = title + '\n\n' + detail;
    mountEl.innerHTML = '';
    mountEl.appendChild(box);
    statusEl.textContent = title;
    if (window.console && console.error) { console.error('[frqtl-showcase]', title, detail); }
}

// ── Registry lookups (no local id list, no fallback) ──────────────────────────

/** A rung by id; FAIL-LOUD naming the declared set — never a quiet default. */
function rungByIdOrThrow(id) {
    var rung = walkthroughById(id);
    if (!rung) {
        throw new Error('[frqtl-showcase] unknown ?rung="' + id + '" — declared rungs: [' +
            WALKTHROUGH.map(function (r) { return r.id; }).join(', ') + ']. (FAIL-LOUD.)');
    }
    return rung;
}

/** id + optional mode → { rung, modeId, renderState }; throws on an unknown id or mode. */
function resolveRung(id, modeId) {
    var rung = rungByIdOrThrow(id);
    var effModeId = (modeId !== null && modeId !== undefined) ? modeId : defaultWalkthroughModeId(rung);
    return { rung: rung, modeId: effModeId, renderState: effectiveRenderState(rung, effModeId) };
}

// ── Nav + panel (GALLERY mode) ───────────────────────────────────────────────

function esc(str) {
    if (str == null) { return ''; }
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderNav() {
    var html = '';
    var prevGroup = null;
    WALKTHROUGH.forEach(function (rung) {
        var group = walkthroughGroup(rung);
        if (group !== prevGroup) {
            html += '<div class="nav-section-title">' + esc(group) + '</div>';
            prevGroup = group;
        }
        html += '<a class="nav-link-item" data-rung="' + esc(rung.id) + '" ' +
                'href="?rung=' + encodeURIComponent(rung.id) + '" ' +
                'title="' + esc(rung.prose) + '">' + esc(rung.title) + '</a>';
    });
    navEl.innerHTML = html;
    navEl.querySelectorAll('a[data-rung]').forEach(function (a) {
        a.addEventListener('click', function (ev) {
            ev.preventDefault();
            selectRung(a.getAttribute('data-rung'), null);
        });
    });
}

function highlightNav(id) {
    navEl.querySelectorAll('a[data-rung]').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('data-rung') === id);
    });
}

function renderPanel(rung, modeId) {
    var modes = walkthroughModes(rung);
    var html = '';
    html += '<div class="desc-label">Walk-through</div>';
    html += '<div class="desc-title">' + esc(rung.title) + '</div>';
    html += '<div class="desc-subtitle">' + esc(walkthroughGroup(rung)) + '</div>';
    html += '<div class="desc-description">' + esc(rung.prose) + '</div>';

    if (modes.length > 1) {
        html += '<div class="desc-section-title">Mode</div><div class="mode-row">';
        modes.forEach(function (m) {
            html += '<span class="mode-btn' + (m.id === modeId ? ' active' : '') +
                    '" data-mode="' + esc(m.id) + '">' + esc(m.label) + '</span>';
        });
        html += '</div>';
    }

    html += '<div class="desc-section-title">Reproduce</div>';
    html += '<div class="desc-reproduce">' + esc(
        "import { bootRecipe } from '@descix/frqtl-sdk';\n" +
        "import { WALKTHROUGH, effectiveRenderState }\n" +
        "  from '@descix/frqtl-sdk/dist/ide/registry/walkthrough.js';\n\n" +
        "const rung = WALKTHROUGH.find(r => r.id === '" + rung.id + "');\n" +
        "await bootRecipe('mount', rung.source, {\n" +
        "  renderState: effectiveRenderState(rung, " +
            (modeId === null ? 'null' : "'" + modeId + "'") + ")\n" +
        "});"
    ) + '</div>';

    panelEl.innerHTML = html;
    panelEl.querySelectorAll('.mode-btn').forEach(function (b) {
        b.addEventListener('click', function () {
            selectRung(rung.id, b.getAttribute('data-mode'));
        });
    });
}

/** Re-state ?rung=&mode= (history.replaceState; a single-mode rung carries no mode). */
function showRungLink(rung, modeId) {
    var url = new URL(window.location.href);
    url.searchParams.set('rung', rung.id);
    if (walkthroughModes(rung).length > 1 && modeId) { url.searchParams.set('mode', modeId); }
    else { url.searchParams.delete('mode'); }
    history.replaceState(null, '', url.toString());
}

/**
 * Boot a resolved rung into the mount. Resolves with the scene; a superseded boot (a newer
 * selection) resolves null. bootRecipe paints its own overlay on failure; the status line says so.
 */
function bootRung(sel) {
    var token = ++bootToken;
    statusEl.textContent = 'booting ' + sel.rung.title + '…';
    mountEl.innerHTML = '';
    return bootRecipe(mountEl, sel.rung.source, { base: DIST_ROOT, renderState: sel.renderState })
        .then(function (scene) {
            if (token !== bootToken) { return null; }
            window.__frqtlScene = scene;           // realm-assertion handle (Playwright)
            return scene;
        }, function (err) {
            if (token === bootToken) {
                statusEl.textContent = sel.rung.title + ' — BOOT FAILED (see overlay)';
                if (window.console && console.error) { console.error('[frqtl-showcase]', err); }
            }
            throw err;
        });
}

function selectRung(id, modeId) {
    var sel;
    try { sel = resolveRung(id, modeId); }
    catch (e) { failLoud('Unknown walk-through rung or mode', String((e && e.message) || e)); return; }
    showRungLink(sel.rung, sel.modeId);
    highlightNav(id);
    renderPanel(sel.rung, sel.modeId);
    bootRung(sel).then(function (scene) {
        if (scene) { statusEl.textContent = sel.rung.title + ' — live'; }
    }, function () { /* painted + logged by bootRung */ });
}

// ── PLAYER mode ──────────────────────────────────────────────────────────────

/**
 * The card for a scene, from its showcase-roster row; `onGo` runs on Continue, or at once when the
 * card is not shown. A scene with no roster row has no card: the declared outcome
 * not-offered-no-roster-row is recorded on the host and the scene goes at once.
 */
function openSceneCard(scene, modeId, onGo) {
    var row = exhibitFor({ kind: scene.kind, id: scene.id, modeId: modeId });
    if (!row) {
        recordRunOnceNotOffered(cardHost, showcaseCardKey(scene.kind, scene.id, modeId), 'not-offered-no-roster-row',
            scene.kind + ' "' + scene.id + '"' + (modeId ? ' mode ' + modeId : '') + ' has no showcase-roster row');
        onGo();
        return;
    }
    var card = showcaseCard(row);
    cardHost.dataset.explainerAbsent = card.absent.join(' ');
    openRunOnceCard(cardHost, {
        seenKey: card.seenKey, title: card.title, paragraphs: card.paragraphs, onContinue: onGo
    }).ready.then(function (d) { if (!d.shows) { onGo(); } });
}

/**
 * A rung: boot it behind the card and HOLD it with the runner's own stop() until the viewer
 * continues (or the card is not shown), then start() it. Either may happen first.
 */
function playRung(id, modeId) {
    var sel;
    try { sel = resolveRung(id, modeId); }
    catch (e) { failLoud('Unknown walk-through rung or mode', String((e && e.message) || e)); return; }
    showRungLink(sel.rung, sel.modeId);
    var rosterMode = walkthroughModes(sel.rung).length > 1 ? sel.modeId : null;
    var row = exhibitFor({ kind: 'rung', id: sel.rung.id, modeId: rosterMode });
    var title = row ? row.title : sel.rung.title;   // the front-page title when the scene is on the roster
    var held = true, scene = null;
    bootRung(sel).then(function (s) {
        scene = s;
        if (held) { s.runner.stop(); statusEl.textContent = title; }
        else { statusEl.textContent = title + ' — live'; }
    }, function () { /* painted + logged by bootRung */ });
    openSceneCard({ kind: 'rung', id: sel.rung.id }, rosterMode, function () {
        if (!held) { return; }
        held = false;
        if (scene) { scene.runner.start(); statusEl.textContent = title + ' — live'; }
    });
}

/** An experiment: the card, then NAVIGATE to its canonical page (replace: Back never bounces here). */
function playExperiment(id) {
    var row;
    try { row = exhibitFor({ kind: 'experiment', id: id }); }   // FAIL-LOUD on an unknown id
    catch (e) { failLoud('Cannot play ?experiment=' + id, String((e && e.message) || e)); return; }
    statusEl.textContent = row ? row.title : id;
    var target = router.resolve('experiments/' + encodeURIComponent(id) + '/index.html') +
        '?engine=' + encodeURIComponent(ENGINE);
    openSceneCard({ kind: 'experiment', id: id }, null, function () { location.replace(target); });
}

// ── Init ─────────────────────────────────────────────────────────────────────

var params   = new URLSearchParams(window.location.search);
var wantRung = params.get('rung');
var wantMode = params.get('mode');
var wantExp  = params.get('experiment');

if (wantRung && wantExp) {
    document.documentElement.dataset.player = 'on';
    failLoud('Ambiguous deep link', '?rung= and ?experiment= name two scenes; a link plays one. (FAIL-LOUD.)');
} else if (wantExp) {
    document.documentElement.dataset.player = 'on';
    playExperiment(wantExp);
} else if (wantRung) {
    document.documentElement.dataset.player = 'on';
    playRung(wantRung, wantMode);
} else {
    // No deep link: the gallery, opening on the registry's OWN first-contact rung.
    renderNav();
    selectRung(FIRST_CONTACT_WALKTHROUGH_ID, null);
}
</script>
</body>
</html>
