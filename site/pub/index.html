<!-- FRQTL SDK showcase — the WALK-THROUGH gallery.

     Authored at sdk/frqtl-sdk/src/index.html; copied VERBATIM to dist/index.html by
     sdk/frqtl-sdk/build.js (build is the sole writer of dist/).

     WHAT IT SHOWS: the rungs of the WALK-THROUGH registry (lib/shim/registry/
     walkthrough.js, shipped at dist/ide/registry/walkthrough.js by the wholesale
     lib/shim -> dist/ide copy). That registry is the package's NEW-SUGAR content —
     every rung is composed of the current objects (SphereEmitter, v2 Wall, Tunnel,
     LiveChart, GraphingDetectorWall). The list, the titles, the prose, the groups,
     the modes and the default selection are ALL READ FROM THE REGISTRY at runtime:
     this page holds NO id list, NO per-item metadata table and NO fallback id. An
     unknown ?rung= FAILS LOUD with a named error.

     HOW IT RUNS: `bootRecipe` (dist/esm/index.js — the standalone recipe host) boots
     the rung's `source` in THIS page with the rung's `effectiveRenderState` bag,
     using a PAGE-RELATIVE base, so every engine/renderer/game script loads from the
     dist this page is served out of (no CDN, no version pin) — the same discipline
     as artifact/sun.html. There is no iframe and no second load path.

     The mount div is deliberately id="canvas-wrapper": that is the id a rung's
     `CameraControls.attach` line looks up (the same id the `empty` host page gives
     its canvas host), so the 3D rungs' MOVE/LOOK joysticks mount here too. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EGPT FRQTL — Emergent Physics from Cellular Automata</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        /* ── Reset ───────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #c8cdd0; }

        /* ── Three-Panel Layout ──────────────────────────── */
        .app { display: flex; height: 100vh; }

        /* ── Left Nav ────────────────────────────────────── */
        .left-nav {
            width: 260px; min-width: 260px;
            background: #111; border-right: 1px solid #222;
            display: flex; flex-direction: column;
            overflow-y: auto;
        }
        .nav-brand {
            padding: 20px 16px 12px;
            border-bottom: 1px solid #222;
        }
        .nav-brand h1 {
            font-size: 1.1rem; font-weight: 700; color: #fff;
            letter-spacing: 1px; margin-bottom: 2px;
        }
        .nav-brand .tagline {
            font-size: 0.72rem; color: #666; line-height: 1.3;
        }
        .nav-section-title {
            padding: 16px 16px 6px; font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px; color: #555;
        }
        .nav-link-item {
            display: block; padding: 10px 16px 10px 20px;
            color: #999; font-size: 0.85rem; cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            text-decoration: none;
        }
        .nav-link-item:hover { background: #1a1a1a; color: #ddd; }
        .nav-link-item.active {
            background: #b6161c; color: #fff;
            border-left-color: #fff;
        }
        .nav-divider { border-top: 1px solid #222; margin: 8px 0; }
        .nav-link-item.sdk-link {
            color: #4a9eff; font-weight: 600;
        }
        .nav-link-item.sdk-link:hover { color: #6db3ff; background: #0d1b2a; }
        .nav-footer {
            margin-top: auto; padding: 12px 16px; border-top: 1px solid #222;
            font-size: 0.65rem; color: #444; line-height: 1.4;
        }

        /* ── Center: Simulation Player ───────────────────── */
        .center-panel {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; position: relative; overflow: hidden;
        }
        #canvas-wrapper { position: relative; width: 600px; height: 400px; }
        .center-status {
            font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
            color: #777; padding: 8px 0 12px;
        }

        /* ── Right: Description Panel ────────────────────── */
        .right-panel {
            width: 320px; min-width: 280px;
            background: #111; border-left: 1px solid #222;
            overflow-y: auto; padding: 24px 20px;
        }
        .desc-label {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: #555; margin-bottom: 4px;
        }
        .desc-title {
            font-size: 1.2rem; font-weight: 700; color: #fff;
            margin-bottom: 2px; line-height: 1.3;
        }
        .desc-subtitle {
            font-size: 0.8rem; color: #888; margin-bottom: 16px;
            font-style: italic;
        }
        .desc-description {
            font-size: 0.88rem; color: #999; line-height: 1.65;
            margin-bottom: 18px;
        }
        .desc-section-title {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px;
            color: #666; margin-bottom: 8px; margin-top: 18px;
            padding-bottom: 4px; border-bottom: 1px solid #1e1e1e;
        }
        .desc-reproduce {
            background: #0d0d0d; border: 1px solid #252525;
            border-radius: 4px; padding: 10px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem; color: #7ec8e3;
            word-break: break-all; line-height: 1.5;
            margin-bottom: 4px; white-space: pre-wrap;
        }
        .mode-row { margin-bottom: 6px; }
        .mode-btn {
            display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px;
            font-size: 0.75rem; color: #9ab; background: #16222f;
            border: 1px solid #24384c; border-radius: 3px; cursor: pointer;
        }
        .mode-btn.active { background: #b6161c; border-color: #fff; color: #fff; }

        /* ── FAIL-LOUD panel ─────────────────────────────── */
        .fail-loud {
            position: absolute; inset: 0; z-index: 9999; padding: 18px;
            overflow: auto; white-space: pre-wrap; background: #1a0000;
            color: #ff6b6b; border: 2px solid #b6161c;
            font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        }

        /* ── Responsive ──────────────────────────────────── */
        @media (max-width: 1100px) {
            .right-panel { width: 260px; min-width: 200px; }
        }
        @media (max-width: 800px) {
            .right-panel { display: none; }
            .left-nav { width: 200px; min-width: 160px; }
        }
        @media (max-width: 600px) {
            .left-nav { display: none; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- ═══ LEFT NAV (built from the WALK-THROUGH registry) ═══ -->
    <nav class="left-nav">
        <div class="nav-brand">
            <h1>EGPT FRQTL</h1>
            <div class="tagline">Emergent Physics from<br>Cellular Automata</div>
        </div>

        <div id="nav-rungs"></div>

        <div class="nav-divider"></div>

        <a class="nav-link-item sdk-link" href="sdk.html" target="_blank">
            Developer SDK Reference
        </a>

        <div class="nav-footer">
            <strong style="color:#777">@descix/frqtl-sdk</strong><br>
            No force calculations. No wave equations.<br>
            Physics emerges from local rules.
        </div>
    </nav>

    <!-- ═══ CENTER: SIMULATION ═══ -->
    <div class="center-panel" id="center-panel">
        <div id="canvas-wrapper" data-role="frqtl-rung-mount"></div>
        <div class="center-status" id="center-status" data-role="frqtl-rung-status">booting…</div>
    </div>

    <!-- ═══ RIGHT: DESCRIPTION ═══ -->
    <div class="right-panel" id="right-panel"></div>

</div>

<!-- The ESM entry resolves page-relative to this dist's own copy. -->
<script type="importmap">{"imports":{"@descix/frqtl-sdk":"./esm/index.js"}}</script>
<script type="module">
/* Copyright 2023-2026 by Essam Abadir */

import { bootRecipe } from '@descix/frqtl-sdk';
// The shipped WALK-THROUGH registry — the ONE authority for which rungs exist,
// their order, their groups, their modes, their prose and the default selection.
// It rides the wholesale lib/shim -> dist/ide copy (build.js copyCommon).
import {
    WALKTHROUGH, walkthroughGroup, walkthroughModes, defaultWalkthroughModeId,
    effectiveRenderState, FIRST_CONTACT_WALKTHROUGH_ID
} from './ide/registry/walkthrough.js';

// Page-relative dist root (no trailing slash — engineRouter({mode:'cdn', base})
// joins base + '/js/...'). Every injected engine/renderer/game script re-anchors
// HERE, not at jsdelivr: this page runs entirely out of the dist it ships in.
var DIST_ROOT = new URL('.', location.href).href.replace(/\/$/, '');

var statusEl = document.getElementById('center-status');
var mountEl  = document.getElementById('canvas-wrapper');
var navEl    = document.getElementById('nav-rungs');
var panelEl  = document.getElementById('right-panel');

var currentRungId = null;
var currentModeId = null;
var bootToken     = 0;   // guards against a stale boot resolving after a re-select

// ── FAIL-LOUD ────────────────────────────────────────────────────────────────

/** Paint a visible failure over the canvas area and rethrow-shaped log. */
function failLoud(title, detail) {
    var box = document.createElement('div');
    box.className = 'fail-loud';
    box.setAttribute('data-role', 'rung-error');
    box.textContent = title + '\n\n' + detail;
    mountEl.innerHTML = '';
    mountEl.appendChild(box);
    statusEl.textContent = title;
    if (window.console && console.error) { console.error('[frqtl-showcase]', title, detail); }
}

// ── Registry lookups (no local id list, no fallback) ──────────────────────────

/**
 * Resolve a rung id against the registry. FAIL-LOUD on an unknown id — naming the
 * id and the declared set. There is deliberately no default-to-something: a stale
 * or mistyped deep link must SURFACE, never quietly load a different experiment.
 */
function rungByIdOrThrow(id) {
    for (var i = 0; i < WALKTHROUGH.length; i++) {
        if (WALKTHROUGH[i].id === id) { return WALKTHROUGH[i]; }
    }
    throw new Error('[frqtl-showcase] unknown ?rung="' + id + '" — declared rungs: [' +
        WALKTHROUGH.map(function (r) { return r.id; }).join(', ') + ']. (FAIL-LOUD.)');
}

// ── Nav (grouped, registry order) ────────────────────────────────────────────

function esc(str) {
    if (str == null) { return ''; }
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderNav() {
    var html = '';
    var prevGroup = null;
    WALKTHROUGH.forEach(function (rung) {
        var group = walkthroughGroup(rung);
        if (group !== prevGroup) {
            html += '<div class="nav-section-title">' + esc(group) + '</div>';
            prevGroup = group;
        }
        html += '<a class="nav-link-item" data-rung="' + esc(rung.id) + '" ' +
                'href="?rung=' + encodeURIComponent(rung.id) + '" ' +
                'title="' + esc(rung.prose) + '">' + esc(rung.title) + '</a>';
    });
    navEl.innerHTML = html;
    navEl.querySelectorAll('a[data-rung]').forEach(function (a) {
        a.addEventListener('click', function (ev) {
            ev.preventDefault();
            selectRung(a.getAttribute('data-rung'), null);
        });
    });
}

function highlightNav(id) {
    navEl.querySelectorAll('a[data-rung]').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('data-rung') === id);
    });
}

// ── Right panel (prose + modes + the reproduce snippet) ──────────────────────

function renderPanel(rung, modeId) {
    var modes = walkthroughModes(rung);
    var html = '';
    html += '<div class="desc-label">Walk-through</div>';
    html += '<div class="desc-title">' + esc(rung.title) + '</div>';
    html += '<div class="desc-subtitle">' + esc(walkthroughGroup(rung)) + '</div>';
    html += '<div class="desc-description">' + esc(rung.prose) + '</div>';

    if (modes.length > 1) {
        html += '<div class="desc-section-title">Mode</div><div class="mode-row">';
        modes.forEach(function (m) {
            html += '<span class="mode-btn' + (m.id === modeId ? ' active' : '') +
                    '" data-mode="' + esc(m.id) + '">' + esc(m.label) + '</span>';
        });
        html += '</div>';
    }

    html += '<div class="desc-section-title">Reproduce</div>';
    html += '<div class="desc-reproduce">' + esc(
        "import { bootRecipe } from '@descix/frqtl-sdk';\n" +
        "import { WALKTHROUGH, effectiveRenderState }\n" +
        "  from '@descix/frqtl-sdk/dist/ide/registry/walkthrough.js';\n\n" +
        "const rung = WALKTHROUGH.find(r => r.id === '" + rung.id + "');\n" +
        "await bootRecipe('mount', rung.source, {\n" +
        "  renderState: effectiveRenderState(rung, " +
            (modeId === null ? 'null' : "'" + modeId + "'") + ")\n" +
        "});"
    ) + '</div>';

    panelEl.innerHTML = html;
    panelEl.querySelectorAll('.mode-btn').forEach(function (b) {
        b.addEventListener('click', function () {
            selectRung(rung.id, b.getAttribute('data-mode'));
        });
    });
}

// ── Selection + boot ─────────────────────────────────────────────────────────

/**
 * Load a rung (optionally in a declared mode). `effectiveRenderState` is the ONE
 * derivation point for the mode-merged bag; `bootRecipe` translates it (renderer /
 * egpt3D / seed pick the boot path; render options + camera replay after start).
 */
function selectRung(id, modeId) {
    var rung;
    try {
        rung = rungByIdOrThrow(id);
    } catch (e) {
        failLoud('Unknown walk-through rung', String((e && e.message) || e));
        return;
    }

    var modes = walkthroughModes(rung);
    var effModeId = (modeId !== null && modeId !== undefined)
        ? modeId : defaultWalkthroughModeId(rung);

    var renderState;
    try {
        // FAIL-LOUD on an undeclared mode id (effectiveRenderState throws by contract).
        renderState = effectiveRenderState(rung, effModeId);
    } catch (e) {
        failLoud('Unknown mode for rung "' + id + '"', String((e && e.message) || e));
        return;
    }

    currentRungId = id;
    currentModeId = effModeId;

    var url = new URL(window.location.href);
    url.searchParams.set('rung', id);
    if (modes.length > 1 && effModeId) { url.searchParams.set('mode', effModeId); }
    else { url.searchParams.delete('mode'); }
    history.replaceState(null, '', url.toString());

    highlightNav(id);
    renderPanel(rung, effModeId);

    var token = ++bootToken;
    statusEl.textContent = 'booting ' + rung.title + '…';
    mountEl.innerHTML = '';

    bootRecipe(mountEl, rung.source, {
        base: DIST_ROOT,
        renderState: renderState
    }).then(function (scene) {
        if (token !== bootToken) { return; }   // superseded by a newer selection
        statusEl.textContent = rung.title + ' — live';
        window.__frqtlScene = scene;           // realm-assertion handle (Playwright)
    }).catch(function (err) {
        if (token !== bootToken) { return; }
        // bootRecipe already painted its own overlay inside the mount; keep the
        // status line honest too (never a silently blank canvas).
        statusEl.textContent = rung.title + ' — BOOT FAILED (see overlay)';
        if (window.console && console.error) { console.error('[frqtl-showcase]', err); }
    });
}

// ── Init ─────────────────────────────────────────────────────────────────────

renderNav();
var params    = new URLSearchParams(window.location.search);
var wantRung  = params.get('rung');
var wantMode  = params.get('mode');
// No deep link -> the registry's OWN first-contact rung (never a local literal).
selectRung(wantRung || FIRST_CONTACT_WALKTHROUGH_ID, wantMode);
</script>
</body>
</html>
