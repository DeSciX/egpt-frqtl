    <div class="experiment-container">

        <div class="experiment-controls">

                <button class="toggle-btn" id="btn-a" title="Input A. ONE switch boolean drives TWO independent generators, one per consuming gate — control-plane fan-out (what a driver or buffer does). The current is never split: a physical T-split was measured and rejected, because it conserves only 0.47 of its input at this lane geometry and lands both branches below the gates' latch-HIGH floor.">OFF</button>
            </div>

            </div>

            <label title="RAIL = every generator's burst per tick, and both gates' supply. LIVE. 6 q/tick is the STANDARD operating point every published LogicGate figure was measured at; the switching threshold is half the rail, derived by the gate itself and never passed in by this page.">
                rail:

            </label>

            <table class="truth-table" id="truth-table">

                </thead>
                <tbody>

                    <tr id="row-01"><td>0</td><td>1</td><td id="tt-01-sum">—</td><td id="tt-01-carry">—</td></tr>
                    <tr id="row-10"><td>1</td><td>0</td><td id="tt-10-sum">—</td><td id="tt-10-carry">—</td></tr>
                    <tr id="row-11"><td>1</td><td>1</td><td id="tt-11-sum">—</td><td id="tt-11-carry">—</td></tr>

        <div class="status-bar">

                <span class="status-value closed" id="stat-carry">CLOSED</span>

            </div>
            <div class="status-item"><span class="status-label">quanta:</span><span class="status-value" id="stat-quanta">0</span></div>
            <div class="status-item"><span class="status-label" title="A NON-ZERO standing population at row (0,0) is HEALTHY, not a leak: both gate supplies run whether their output is HIGH or LOW (a LOW output is the rail being dumped into the shunt valve), so this is static logic with no idle state. What must read exactly 0.000 at (0,0) are the two GROUNDS, not the quanta count.">baseline: 2 gate rails always on</span></div>
        </div>
    </div>

    <!--
        HEADLESS OBSERVABILITY (the tester's hooks; display:none so it never affects layout).
        Playwright reads THESE, never tickData.
            data-alive        : alive quantum count this tick
            data-input-a/b    : the two switch booleans (0/1)
            data-row          : the truth-table row key, "AB"
            data-sum/-carry   : the two gate output booleans (0/1)
            data-sum-level    : SUM ground current, q/tick (grounded Trace stub, calibrated)
            data-carry-level  : CARRY ground current, q/tick
            data-xor-a/-xor-b : the XOR gate's two input terminal currents, q/tick
            data-and-a/-and-b : the AND gate's two input terminal currents, q/tick
            data-valve-sum    : "open" | "closed" — the SUM gate's shunt valve
            data-valve-carry  : "open" | "closed" — the CARRY gate's shunt valve
            data-rail         : the live rail voltage, q/tick
            data-settle       : the factory's OWN computed settle budget, ticks
            data-settled      : 1 once the current row has been held for the settle budget
            data-expected      / data-observed  : "SUM,CARRY" expected vs observed for this row
            data-row-correct  : 1 when the settled observation matches the expected row
            data-table-correct: 1 when EVERY row observed so far matched
            data-scale        : the render magnification (canvas px per physics px)
    -->
    <div id="ha-metrics"
         data-alive="0" data-input-a="0" data-input-b="0" data-row="00"
         data-sum="0" data-carry="0" data-sum-level="0" data-carry-level="0"
         data-xor-a="0" data-xor-b="0" data-and-a="0" data-and-b="0"
         data-valve-sum="closed" data-valve-carry="closed"
         data-rail="6" data-settle="0" data-settled="0"
         data-expected="0,0" data-observed="—" data-row-correct="0" data-table-correct="0"
         data-scale="1"></div>

    <script>
    /**
     * Circuit SAT — the half-adder, rebuilt on `LogicGate` + `Trace`.
     *
     * WHAT YOU ARE LOOKING AT. Two gates side by side: SUM = A XOR B on top, CARRY = A AND B
     * below. The half-adder is two gates WIDE and one level deep — neither gate feeds the
     * other — so nothing here cascades. Each logical input drives TWO independent generators
     * at the full rail (control-plane fan-out); the current is never divided.
     *
     * The particles filling a channel ARE the current. Watch the THREE-WAY valve distinction,
     * which is the picture this page exists for:
     *   OPEN   — the gate's supply reaches the outlet, the readout stub fills, its ground tallies;
     *   CLOSED — the supply piles up AT the shunt valve and the channel beyond it is DARK
     *            (a correctly-computed 0, not a broken circuit);
     *   DEAD   — no fill anywhere, which is what a broken scene looks like.
     * A numeric 0 cannot tell the first two apart; only the eye can, which is why the valve
     * blocks in the status bar are stamped independently per gate.
     *
     * WHY THE VIEW IS ZOOMED. The whole circuit is 72 x 54 PHYSICS PIXELS — the measured
     * minimal gate cell is 20 x 27 — so at 1:1 it would be a smudge. The page frames it with
     * the renderer's own 2D CAMERA (`cameraControl.setOrbit({target, distance})`, where
     * `distance` is the visible physics-px height). That is a view transform at the output
     * boundary: it changes which pixels you are shown, never a frame, a dimension or a tick.
     *
     * A NON-ZERO QUANTA COUNT AT ROW (0,0) IS HEALTHY. Both gate supplies run whether their
     * output is HIGH or LOW — a LOW output is the rail being dumped into the shunt valve — so
     * this is static logic with no idle state. What must read EXACTLY 0.000 at (0,0) are the
     * two grounds, not the population.
     *
     * PROVENANCE. The scene is `setupHalfAdder` — the same factory the acceptance rig drives,
     * so this picture and the published numbers are the SAME circuit. Layout, levels and
     * timing come from `docs/internal/physics-lab/half-adder-bench/`.
     */
    var runner = null;
    var _metricsEl = null;
    var _res = null;            // the current setup result
    var _tick = 0;
    var _ticksInRow = 0;        // ticks since the last input change (settle gate for observations)

    var CANVAS_W = 760, CANVAS_H = 520;
    var GATE_LEFT = 60, GATE_TOP = 15;
    var VIEW_MARGIN = 1.35;     // how much room to leave around the circuit when framing it
    var FAST_STEPS = 8;

    var STATE = { a: false, b: false, rail: 6, fast: false };

    var EXPECTED = {
        '00': { sum: false, carry: false },
        '01': { sum: true,  carry: false },
        '10': { sum: true,  carry: false },
        '11': { sum: false, carry: true  }
    };
    var observed = {};          // rowKey -> {sum, carry} once that row has settled

    window.__frqtlHalfAdder = { activeQuanta: 0, sumLevel: 0, carryLevel: 0, tableCorrect: false };

    function el(id) { return document.getElementById(id); }
    function rowKey() { return (STATE.a ? '1' : '0') + (STATE.b ? '1' : '0'); }
    function bit(v) { return v ? '1' : '0'; }

    /**
     * THE ONE CONTROL DECLARATION. Declared once and used for BOTH the page's own widgets and
     * `runner.experimentControls` (the published `lib/shim/controls`-shaped handle a host
     * strip consumes). The two input rows delegate to the factory's own handle, so the page
     * never reaches an inner emitter.
     */
    var CONTROLS = [
        {
            id: 'inputA', label: 'input A', min: 0, max: 1, step: 1, value: 0,
            fmt: function (v) { return v ? '1 (HIGH)' : '0 (LOW)'; },
            get: function () { return STATE.a ? 1 : 0; },
            onChange: function (v) { setInput('a', !!v); }
        },
        {
            id: 'inputB', label: 'input B', min: 0, max: 1, step: 1, value: 0,
            fmt: function (v) { return v ? '1 (HIGH)' : '0 (LOW)'; },
            get: function () { return STATE.b ? 1 : 0; },
            onChange: function (v) { setInput('b', !!v); }
        },
        {
            id: 'rail', label: 'rail (burst/tick)', min: 1, max: 16, step: 1, value: 6,
            fmt: function (v) { return String(v) + ' q/tick'; },
            get: function () { return STATE.rail; },
            onChange: function (v) { setRail(v); }
        },
        {
            id: 'speed', label: 'ticks per frame', min: 1, max: FAST_STEPS, step: FAST_STEPS - 1, value: 1,
            fmt: function (v) { return String(v) + 'x'; },
            get: function () { return STATE.fast ? FAST_STEPS : 1; },
            onChange: function (v) { setFast(v > 1); }
        }
    ];

    // ── Live knobs — every one goes through the factory's own handle ──────────

    function setInput(which, on) {
        STATE[which] = !!on;
        if (which === 'a') { _res.setInputA(STATE.a); } else { _res.setInputB(STATE.b); }
        var btn = el(which === 'a' ? 'btn-a' : 'btn-b');
        btn.textContent = STATE[which] ? 'ON' : 'OFF';
        btn.className = 'toggle-btn' + (STATE[which] ? ' active' : '');
        // A row change restarts the settle clock: an observation recorded before the circuit
        // has settled is an instrument fault, not a measurement.
        _ticksInRow = 0;
        stamp();
    }

    function setRail(v) {
        STATE.rail = parseInt(v, 10);
        _res.setRailVoltage(STATE.rail);
        el('ctrl-rail').value = String(STATE.rail);
        el('ctrl-rail-val').textContent = String(STATE.rail);
        _ticksInRow = 0;                        // the rail moved: levels must re-settle
        stamp();
    }

    function setFast(on) {
        STATE.fast = !!on;
        runner.stepsPerFrame = STATE.fast ? FAST_STEPS : 1;
        var btn = el('btn-speed');
        btn.textContent = STATE.fast ? (FAST_STEPS + 'x') : '1x';
        btn.className = 'toggle-btn' + (STATE.fast ? ' active' : '');
    }

    // ── Truth table ──────────────────────────────────────────────────────────

    function updateTruthTable(sumHigh, carryHigh, settled) {
        var key = rowKey();
        if (settled) { observed[key] = { sum: sumHigh, carry: carryHigh }; }
        var combos = ['00', '01', '10', '11'];
        for (var i = 0; i < combos.length; i++) {
            var k = combos[i];
            var row = el('row-' + k), tdSum = el('tt-' + k + '-sum'), tdCarry = el('tt-' + k + '-carry');
            if (!row) { continue; }
            var cells = row.querySelectorAll('td');
            for (var ci = 0; ci < cells.length; ci++) {
                if (k === key) { cells[ci].classList.add('active-row'); }
                else { cells[ci].classList.remove('active-row'); }
            }
            var exp = EXPECTED[k];
            var obs = (k === key) ? { sum: sumHigh, carry: carryHigh } : observed[k];
            if (!obs) {
                tdSum.textContent = '—'; tdCarry.textContent = '—';
                tdSum.className = (k === key ? 'active-row' : '');
                tdCarry.className = (k === key ? 'active-row' : '');
                continue;
            }
            tdSum.textContent = obs.sum ? 'HIGH' : 'LOW';
            tdCarry.textContent = obs.carry ? 'HIGH' : 'LOW';
            // Colour by AGREEMENT with the expected row — a wrong cell is loudly wrong.
            tdSum.className = (k === key ? 'active-row ' : '') +
                (obs.sum !== exp.sum ? 'wrong' : (obs.sum ? 'high' : 'low'));
            tdCarry.className = (k === key ? 'active-row ' : '') +
                (obs.carry !== exp.carry ? 'wrong' : (obs.carry ? 'high' : 'low'));
        }
    }

    function tableCorrect() {
        var combos = ['00', '01', '10', '11'], seen = 0;
        for (var i = 0; i < combos.length; i++) {
            var o = observed[combos[i]];
            if (!o) { continue; }
            seen++;
            var e = EXPECTED[combos[i]];
            if (o.sum !== e.sum || o.carry !== e.carry) { return false; }
        }
        return seen > 0;
    }

    /** Stamp every headless hook from AUTHORITATIVE state (the factory's handle, never a widget). */
    function stamp() {
        if (!_metricsEl || !_res) { return; }
        var s = _res.getState();
        var settle = _res.getSettleBudget();
        var settled = _ticksInRow >= settle;
        var key = rowKey(), exp = EXPECTED[key];

        updateTruthTable(s.SUM, s.CARRY, settled);

        _metricsEl.setAttribute('data-input-a', bit(s.A));
        _metricsEl.setAttribute('data-input-b', bit(s.B));
        _metricsEl.setAttribute('data-row', key);
        _metricsEl.setAttribute('data-sum', bit(s.SUM));
        _metricsEl.setAttribute('data-carry', bit(s.CARRY));
        _metricsEl.setAttribute('data-sum-level', s.sumLevel.toFixed(3));
        _metricsEl.setAttribute('data-carry-level', s.carryLevel.toFixed(3));
        _metricsEl.setAttribute('data-xor-a', s.gateStates.SUM.currentA.toFixed(3));
        _metricsEl.setAttribute('data-xor-b', s.gateStates.SUM.currentB.toFixed(3));
        _metricsEl.setAttribute('data-and-a', s.gateStates.CARRY.currentA.toFixed(3));
        _metricsEl.setAttribute('data-and-b', s.gateStates.CARRY.currentB.toFixed(3));
        _metricsEl.setAttribute('data-valve-sum', s.SUM ? 'open' : 'closed');
        _metricsEl.setAttribute('data-valve-carry', s.CARRY ? 'open' : 'closed');
        _metricsEl.setAttribute('data-rail', String(_res.getRailVoltage()));
        _metricsEl.setAttribute('data-settle', String(settle));
        _metricsEl.setAttribute('data-settled', settled ? '1' : '0');
        _metricsEl.setAttribute('data-expected', bit(exp.sum) + ',' + bit(exp.carry));
        _metricsEl.setAttribute('data-observed', bit(s.SUM) + ',' + bit(s.CARRY));
        _metricsEl.setAttribute('data-row-correct',
            (settled && s.SUM === exp.sum && s.CARRY === exp.carry) ? '1' : '0');
        _metricsEl.setAttribute('data-table-correct', tableCorrect() ? '1' : '0');

        // Per-gate valve state — a distinct block AND its own data-valve-state stamp, so the
        // three-way distinction is readable per gate without reading a level.
        [['sum', 'SUM', s.SUM, s.sumLevel], ['carry', 'CARRY', s.CARRY, s.carryLevel]]
            .forEach(function (row) {
                var open = row[2];
                el('gate-' + row[0]).setAttribute('data-valve-state', open ? 'open' : 'closed');
                el('valve-' + row[0]).className = 'valve-block ' + (open ? 'open' : 'closed');
                var v = el('stat-' + row[0]);
                v.textContent = open ? 'OPEN' : 'CLOSED';
                v.className = 'status-value ' + (open ? 'open' : 'closed');
                el('stat-' + row[0] + '-level').textContent = row[3].toFixed(3) + ' q/t';
            });

        window.__frqtlHalfAdder.sumLevel = s.sumLevel;
        window.__frqtlHalfAdder.carryLevel = s.carryLevel;
        window.__frqtlHalfAdder.tableCorrect = tableCorrect();
    }

    /**
     * FRAME THE CIRCUIT. The whole half-adder is ~72 x 54 physics px, so the page zooms with
     * the renderer's own 2D camera rather than inventing a page-local scale: `distance` IS the
     * visible physics-px height, and `target` is the point at the view centre. Derived from
     * the factory's OWN `getLayout().footprint` — no coordinate is typed here.
     */
    function frameCircuit() {
        var cam = runner.cameraControl;
        if (!cam) {
            throw new Error('[circuit-sat] the active renderer provider exposes no cameraControl, ' +
                'so the 72x54 px circuit cannot be framed and the page would render an ' +
                'illegible smudge. This page requires the 2D (p5) provider. (FAIL-LOUD.)');
        }
        var fp = _res.getLayout().footprint;      // [left, top, w, h]
        var distance = Math.max(fp[3] * VIEW_MARGIN, fp[2] * VIEW_MARGIN * CANVAS_H / CANVAS_W);
        cam.setOrbit({ target: { x: fp[0] + fp[2] / 2, y: fp[1] + fp[3] / 2 }, distance: distance });
        _metricsEl.setAttribute('data-scale', (CANVAS_H / distance).toFixed(2));
    }

    /**
     * (Re)build the scene through the runner's OWN setup seam. `runner.setup()` disposes the
     * previous setupResult first (canonical teardown), so nothing can stack emitters or walls.
     * `runner` goes IN the options bag so the factory subscribes every part to the runner's
     * per-tick fan-out — REQUIRED, and it is also why this page must never call
     * `_res.onTick()` itself (the factory throws on the second tick path rather than letting
     * two readers consume one TickData).
     */
    function buildScene() {
        _res = runner.setup(setupHalfAdder, {
            runner: runner,
            left: GATE_LEFT, top: GATE_TOP,
            railVoltage: STATE.rail,
            inputA: STATE.a, inputB: STATE.b
        });
        observed = {};
        _ticksInRow = 0;
        // ONE control declaration, published for a host strip. Re-published after a rebuild so
        // the handle a host holds is never the disposed scene's.
        runner.experimentControls = CONTROLS;
        frameCircuit();
        stamp();
    }

    window.setup = function () {
        _metricsEl = el('ha-metrics');

        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: CANVAS_W,
            canvasH: CANVAS_H,
            seed: 42,
            onTick: function (tickData) {
                _tick++;
                _ticksInRow++;
                var frames = (tickData && tickData.frameData) ? tickData.frameData : [];
                window.__frqtlHalfAdder.activeQuanta = frames.length;
                _metricsEl.setAttribute('data-alive', String(frames.length));
                el('stat-tick').textContent = String(_tick);
                el('stat-quanta').textContent = String(frames.length);
                stamp();
            }
        });

        // CREATE THE CANVAS FIRST — the canonical scaffold step. Without it p5 silently makes
        // its own default 100x100 offscreen canvas and the page renders nothing visible.
        runner.createCanvas();

        buildScene();

        el('btn-a').addEventListener('click', function () { setInput('a', !STATE.a); });
        el('btn-b').addEventListener('click', function () { setInput('b', !STATE.b); });
        el('btn-speed').addEventListener('click', function () { setFast(!STATE.fast); });
        el('ctrl-rail').addEventListener('input', function () { setRail(this.value); });

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 (its load calls
    // window.setup) on every renderer (FRAQTL #74).
    window._egptStartSketch({ p5: 'always' });
    </script>
</body>
</html>
