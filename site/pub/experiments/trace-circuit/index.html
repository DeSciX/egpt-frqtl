<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EGPT — Trace Circuit (the wire part: source → trace → ground, 2D)</title>
    <link rel="stylesheet" href="../_shared/experiment-layout.css">
    <style>
        .experiment-controls {
            flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
            padding: 6px 12px; background: #0d0d0d; border-top: 1px solid #2a2a2a; flex-wrap: wrap;
        }
        .experiment-controls label { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .experiment-controls input[type="checkbox"] { cursor: pointer; accent-color: #7ec8e3; }
        .experiment-controls input[type="range"] { width: 120px; cursor: pointer; accent-color: #7ec8e3; }
        .experiment-controls select { background: #1a1a1a; color: #ddd; border: 1px solid #333; font-size: 12px; padding: 2px 4px; }
        .experiment-controls span.val { color: #7ec8e3; min-width: 30px; display: inline-block; text-align: right; }
        #trace-metrics { display: none; }
    </style>
</head>
<body>

    <script>window._egptDefaultEngine = "wasm";
    window._egptEnginePathMap = {"assets/vendor/":"../../js/lib/","assets/render/":"../../js/consumers/","assets/models/":"../../js/models/","compat/providers/":"../../js/compat/","compat/":"../../js/compat/","objects/":"../../js/game/","experiments/_shared/":"../../experiments/_shared/","experiments/":"../../experiments/","shim/":"../../ide/"};</script>
    <script>window._egptWasmPkgUrl = new URL("../../fat/pkg-web/egpt_wasm.js", document.baseURI).href;</script>

    <!-- 2D ONLY (p5). A Trace routes on the x/y grid; the conduction picture is a flat
         x-y observable, so no ?egpt3D path is offered here on purpose. -->

    <script src="../_shared/stack-boot.js"
        data-page-scripts="
            ../../js/game/setup/setupSphereEmitter3D.js,
            ../../js/game/setup/setupTraceCircuit.js,
            ../_shared/experiment-metrics.js
        "></script>

    <div class="experiment-container">
        <div class="experiment-canvas" id="canvas-wrapper"></div>
        <div class="experiment-controls">
            <label title="Toggle the source. A collimated laser emitter sits just inside the Trace's inlet, aimed down the first leg, so the whole burst is fed into the bore rather than sprayed at the inlet walls.">
                <input type="checkbox" id="ctrl-emit" checked> Emit
            </label>

            <!-- VOLTAGE — the live knob. Emitter burst per tick. -->
            <label title="VOLTAGE = the emitter's burst per tick (quanta/tick pushed into the inlet). LIVE — drag it and the current tracks it with no rebuild. In this regime (inter-quantum collisions OFF) the Trace is a lossless waveguide, so delivered current is a straight multiple of voltage with no ceiling: whatever the source pushes in arrives at ground. Watch the 'delivered' readout follow the slider. Turning voltage to 0 stops the source; the current then decays as the quanta already in flight drain to ground (one propagation delay).">
                voltage:
                <input type="range" id="ctrl-voltage" min="0" max="32" step="1" value="6">
                <span class="val" id="ctrl-voltage-val">6</span> q/t
            </label>

            <!-- BORE — rebuild-class (wall geometry). -->
            <label title="BORE = the clear aperture of the wire, px. REBUILD-class, not live: the bore is wall geometry, so changing it re-runs the setup factory in place (restart-in-place — the canvas survives, the scene restarts at tick 0). Transport is FLAT in bore: a bore-3 wire carries the same current as a bore-40 one once the current is inside. What bore does change is (a) how much a source at the mouth can push in, and (b) whether a CORNER works — turns collapse as the bore narrows.">
                bore:
                <input type="range" id="ctrl-bore" min="1" max="24" step="1" value="12">
                <span class="val" id="ctrl-bore-val">12</span>px
            </label>

            <!-- WALL — rebuild-class. The real shrink floor. -->
            <label title="WALL THICKNESS = the insulation, px. REBUILD-class. THIS is the shrink floor, not the bore: a bore-1 wire conducts at G=0.99 with wall 10, but leaks 57% with wall 3. A too-thin wall does not degrade gracefully — it goes TRANSPARENT, and the fault looks exactly like a broken conductor. Thicker insulation also buys crosstalk down between parallel lanes, at the cost of pitch.">
                wall:
                <input type="range" id="ctrl-wall" min="1" max="16" step="1" value="6">
                <span class="val" id="ctrl-wall-val">6</span>px
            </label>

            <!-- LANES — the miniaturization demo. -->
            <label title="PARALLEL LANES — independent Traces stacked wall-against-wall at bore + 2x wallThickness. REBUILD-class. Only lane 0 is fed; the dark lanes ARE the crosstalk measurement (measured 0.98% into the immediately adjacent lane at bore 3 / wall 3, and exactly zero into every lane beyond it). This is the picture that shows the part shrinks: several lanes inside a narrow band with the fed lane still at full current.">
                lanes:
                <input type="range" id="ctrl-lanes" min="1" max="6" step="1" value="1">
                <span class="val" id="ctrl-lanes-val">1</span>
            </label>

            <!-- ROUTE — the 2D placement demo. -->
            <label title="ROUTE — the waypoint path the wire follows. REBUILD-class. A Trace routes on the CARDINAL grid only (a diagonal corridor was measured not to conduct), turning right angles through re-emitting junctions. Straight is lossless; each corner costs a measurable fraction of the current, and corners multiply along a route.">
                route:
                <select id="ctrl-route">
                    <option value="straight" selected>straight</option>
                    <option value="corner">one corner</option>
                    <option value="sbend">S-bend (two corners)</option>
                </select>
            </label>

            <label title="Live readouts off the Trace's own ground terminal (a destroy+count Wall). 'delivered' is the calibrated total; 'I' is delivered per tick over the sampled window; 'G' is I ÷ voltage — 1.00 is a perfect conductor.">
                delivered: <span class="val" id="ctrl-delivered">0</span>
                &nbsp;I: <span class="val" id="ctrl-current">0.00</span>/t
                &nbsp;G: <span class="val" id="ctrl-g">0.00</span>
            </label>

            <label title="Live count of alive quanta.">
                quanta: <span class="val" id="ctrl-count">0</span>
            </label>
        </div>
    </div>

    <!--
        HEADLESS OBSERVABILITY (the tester's hooks; display:none so it never affects layout)
            data-alive       : alive quantum count this tick
            data-voltage     : the CURRENT emitter burst/tick
            data-delivered   : calibrated quanta delivered to ground since the scene was built
            data-current     : delivered per tick over the sampled window
            data-conductance : current ÷ voltage (1.00 = perfect conductor)
            data-crosstalk   : fraction of lane 0's current appearing in the dark lanes (0 with 1 lane)
            data-bore / data-wall / data-lanes / data-pitch / data-route
            data-corners     : how many right-angle junctions the current route carries
    -->
    <div id="trace-metrics"
         data-alive="0" data-voltage="6" data-delivered="0" data-current="0"
         data-conductance="0" data-crosstalk="0"
         data-bore="12" data-wall="6" data-lanes="1" data-pitch="24"
         data-route="straight" data-corners="0"></div>

    <script>
    /**
     * Trace Circuit — the wire-part demo page.
     *
     * WHAT YOU ARE LOOKING AT. A collimated source at the left feeds a TRACE — the wire part:
     * mirror-walled runs joined by re-emitting corner junctions — which carries the current to
     * a ground terminal that destroys and tallies every arrival. The particles you see filling
     * the channel ARE the current; the walls contain them completely (zero leak), so the fill
     * is uniform from inlet to outlet and nothing sprays outside the blue rails.
     *
     * WHAT TO DRIVE. `voltage` is live — drag it and the fill visibly thickens/thins and the
     * G readout holds near 1.00, because a lossless waveguide delivers whatever is pushed in.
     * `bore`, `wall`, `lanes` and `route` are REBUILD-class (all of them are wall geometry), so
     * they re-run the setup factory in place rather than pretending to be live.
     *
     * THE ORDERING CONTRACT this page depends on: `universe.init()` must precede any
     * LargeObject registration, and in this stack the EMITTER FACTORY owns `init()`. The setup
     * factory therefore builds its source before its walls. See setupTraceCircuit.js.
     */
    var runner = null;
    var _metricsEl = null;
    var _res = null;          // the current setup result (rebuilt when geometry changes)

    var ROUTES = {
        straight: function (W, H) { return [[40, Math.round(H / 2)], [W - 60, Math.round(H / 2)]]; },
        corner:   function (W, H) { return [[40, Math.round(H * 0.3)], [Math.round(W * 0.62), Math.round(H * 0.3)],
                                            [Math.round(W * 0.62), H - 70]]; },
        sbend:    function (W, H) { return [[40, Math.round(H * 0.24)], [Math.round(W * 0.42), Math.round(H * 0.24)],
                                            [Math.round(W * 0.42), Math.round(H * 0.72)],
                                            [W - 60, Math.round(H * 0.72)]]; }
    };

    var STATE = { voltage: 6, bore: 12, wall: 6, lanes: 1, route: 'straight', emit: true };
    var CANVAS_W = 760, CANVAS_H = 520;

    window.__frqtlTraceCircuit = { activeQuanta: 0, voltage: 6, delivered: 0, conductance: 0 };

    function el(id) { return document.getElementById(id); }

    /** Stamp every headless hook from AUTHORITATIVE state (never from the raw slider value). */
    function stamp() {
        if (!_metricsEl || !_res) { return; }
        var c = _res.traceControl;
        var delivered = c.getDelivered();
        var current = c.getCurrent();
        var g = c.getConductance();
        _metricsEl.setAttribute('data-voltage', String(c.getVoltage()));
        _metricsEl.setAttribute('data-delivered', String(delivered));
        _metricsEl.setAttribute('data-current', current.toFixed(3));
        _metricsEl.setAttribute('data-conductance', g.toFixed(3));
        _metricsEl.setAttribute('data-crosstalk', c.getCrosstalk().toFixed(4));
        _metricsEl.setAttribute('data-bore', String(STATE.bore));
        _metricsEl.setAttribute('data-wall', String(STATE.wall));
        _metricsEl.setAttribute('data-lanes', String(c.getLanes()));
        _metricsEl.setAttribute('data-pitch', String(c.getPitch()));
        _metricsEl.setAttribute('data-route', STATE.route);
        _metricsEl.setAttribute('data-corners', String(_res.trace.junctions.length));
        el('ctrl-delivered').textContent = String(delivered);
        el('ctrl-current').textContent = current.toFixed(2);
        el('ctrl-g').textContent = g.toFixed(2);
        window.__frqtlTraceCircuit.voltage = c.getVoltage();
        window.__frqtlTraceCircuit.delivered = delivered;
        window.__frqtlTraceCircuit.conductance = g;
    }

    /**
     * (Re)build the scene through the runner's OWN setup seam. `runner.setup()` disposes the
     * previous setupResult first (canonical teardown), so a geometry change can never stack
     * emitters, walls or tick subscriptions.
     *
     * `runner` is passed IN the options bag: the factory subscribes every lane to the runner's
     * per-tick fan-out, which is REQUIRED — `FrqtlApp` never calls a setupResult's
     * `onTick`, so without it the corner junctions never redirect and the ground reads 0
     * forever (which looks exactly like a wire that does not conduct).
     */
    function buildScene() {
        var routeFn = ROUTES[STATE.route] || ROUTES.straight;
        _res = runner.setup(setupTraceCircuit, {
            runner: runner,
            path: routeFn(CANVAS_W, CANVAS_H),
            bore: STATE.bore,
            wallThickness: STATE.wall,
            voltage: STATE.voltage,
            lanes: STATE.lanes,
            active: STATE.emit
        });
        stamp();
    }

    window.setup = function () {
        _metricsEl = el('trace-metrics');

        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: CANVAS_W,
            canvasH: CANVAS_H,
            seed: 42,
            onTick: function (tickData) {
                var frames = (tickData && tickData.frameData) ? tickData.frameData : [];
                window.__frqtlTraceCircuit.activeQuanta = frames.length;
                if (_metricsEl) { _metricsEl.setAttribute('data-alive', String(frames.length)); }
                el('ctrl-count').textContent = String(frames.length);
                stamp();
            }
        });

        // CREATE THE CANVAS FIRST — the canonical scaffold step. `createCanvas()` delegates to
        // the active renderer provider's init({parentEl,width,height}); without it p5 silently
        // makes its own default 100x100 offscreen canvas and the page renders nothing visible.
        runner.createCanvas();

        buildScene();

        // ── Controls ──────────────────────────────────────────────────────────
        // LIVE: voltage. Straight through to the emitter's burst size.
        el('ctrl-voltage').addEventListener('input', function () {
            STATE.voltage = parseInt(this.value, 10);
            el('ctrl-voltage-val').textContent = String(STATE.voltage);
            _res.traceControl.setVoltage(STATE.voltage);
            stamp();
        });

        // REBUILD: every geometry knob. Wall geometry cannot change under a running scene,
        // so these re-run the setup factory in place rather than pretending to be live.
        function rebuildKnob(id, valId, key) {
            el(id).addEventListener('input', function () { el(valId).textContent = String(this.value); });
            el(id).addEventListener('change', function () {
                STATE[key] = parseInt(this.value, 10);
                el(valId).textContent = String(STATE[key]);
                buildScene();
            });
        }
        rebuildKnob('ctrl-bore', 'ctrl-bore-val', 'bore');
        rebuildKnob('ctrl-wall', 'ctrl-wall-val', 'wall');
        rebuildKnob('ctrl-lanes', 'ctrl-lanes-val', 'lanes');

        el('ctrl-route').addEventListener('change', function () {
            STATE.route = this.value;
            buildScene();
        });

        el('ctrl-emit').addEventListener('change', function () {
            STATE.emit = !!this.checked;
            _res.traceControl.setActive(STATE.emit);
        });

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 (its load calls
    // window.setup) on every renderer (FRAQTL #74).
    window._egptStartSketch({ p5: 'always' });
    </script>
</body>
</html>
