<body>

    <!-- Page structure -->
    <div class="experiment-container">
        <div class="experiment-canvas" id="canvas-wrapper"></div>
        <div class="experiment-controls">
            <label title="Toggle sustained ring emission on/off">
                <input type="checkbox" id="ctrl-autofire" checked> Emit
            </label>
            <label title="Radial velocity magnitude each ring leaf's (vx,vy) is scaled to. 0 = collimated cylinder (laser). >0 = diverging cone (flashlight); half-angle = atan(spread/vz).">
                spread:
                <input type="range" id="ctrl-spread" min="0" max="2" step="0.05" value="0.6">
                <span class="val" id="ctrl-spread-val">0.60</span>
            </label>
            <label title="Constant forward velocity (px/tick) along z">
                vz:
                <input type="range" id="ctrl-vz" min="0.1" max="4" step="0.1" value="1">
                <span class="val" id="ctrl-vz-val">1.0</span>
            </label>
            <label title="Outer concentric-ring radius (px)">
                ring radius:
                <input type="range" id="ctrl-ringRadius" min="10" max="120" step="5" value="40">
                <span class="val" id="ctrl-ringRadius-val">40</span>
            </label>
            <label title="Number of concentric rings per burst">
                rings:
                <input type="range" id="ctrl-ringCount" min="1" max="10" step="1" value="4">
                <span class="val" id="ctrl-ringCount-val">4</span>
            </label>
            <!-- Camera orbit controls — shown ONLY for an ANGULAR camera (OrbitBag.hasAngularPose
                 on the camera handle's poseFields). Never renderer-sniffed. -->
            <span id="camera-controls" style="display:none; align-items:center; gap:16px;">
                <label title="Orbit the camera horizontally">
                    cam azimuth:
                    <input type="range" id="cam-azimuth" min="-180" max="180" step="1" value="35">
                    <span class="val" id="cam-azimuth-val">35</span>
                </label>
                <label title="Orbit the camera vertically">
                    cam elevation:
                    <input type="range" id="cam-elevation" min="-85" max="85" step="1" value="22">
                    <span class="val" id="cam-elevation-val">22</span>
                </label>
                <label title="Dolly the camera in/out">
                    cam distance:
                    <input type="range" id="cam-distance" min="200" max="2400" step="20" value="960">
                    <span class="val" id="cam-distance-val">960</span>
                </label>
                <span title="Pre-computed perspectives — try all three to see the cone along AND across its axis">
                    view:
                    <button type="button" id="cam-preset-table-top" class="cam-preset">table-top</button>
                    <button type="button" id="cam-preset-down-barrel" class="cam-preset">down-barrel</button>
                    <button type="button" id="cam-preset-rooftop" class="cam-preset">rooftop</button>
                </span>
            </span>
        </div>
        <div id="metrics-panel"></div>
        <!--
            Realm-observable proof hook for Playwright.
            data-half-angle-x100 : Math.round(measured half-angle in degrees * 100),
                                    averaged across all currently-alive quanta
                                    (Math.atan2(rAvg, zAvg) — mixes ring generations,
                                    so it is a live INDICATOR, not the tight bench
                                    S2/S3 oracle; canonical-bench owns the precise
                                    golden for the single-burst measurement).
            data-active-quanta    : count of active leaf frames this tick.
            data-spread-x100      : the CURRENT spread knob value * 100 (integer).
            Updated each tick by the onTick callback. Integer attrs (float attrs
            are fragile — see particle-walk-3d's SAME convention).
        -->
        <div id="cone-emitter-metrics"
             data-role="cone-emitter-metrics"
             data-half-angle-x100="0"
             data-active-quanta="0"
             data-spread-x100="60"></div>
    </div>

    <!-- Experiment sketch -->
    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    /**
     * Cone Emitter 3D — canonical per-experiment page.
     *
     * The smallest GYM-visible 3D surface for the CEO's concentric-ring
     * cone-vs-cylinder construction (canonical-bench S2/S3). ONE live spread
     * knob drives the emergent geometry: spread=0 is a collimated LASER
     * (cylinder); spread>0 is a diverging FLASHLIGHT (cone), half-angle
     * converging to atan(spread/vz) — see
     * lib/frqtl/objects/setup/setupConeEmitter3D.js for the full physics note
     * and `.claude/agent-memory/frqtl-experiment-coder/
     * reference_concentric_ring_cone_vs_cylinder_law.md` for the measured law.
     *
     * Engine-agnostic: runs WASM via FrqtlApp + the compat facade.
     * Zero new physics (canonical-bench SU1) — pure composition of M5
     * (velocity conserved) + S1 (axes identical).
     */
    var runner    = null;
    var metrics   = null;
    var tick      = 0;
    var _metricsEl = null;

    window.__frqtlConeEmitter = { halfAngleDeg: 0, activeQuanta: 0, spread: 0.6, vz: 1 };

    window.setup = function () {
        _metricsEl = document.getElementById('cone-emitter-metrics');

        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: 600,
            canvasH: 600,
            seed: 42,
            onTick: function (tickData) {
                tick++;

                // ── Live half-angle indicator (mixed-generation average) ────────
                var frames = tickData && tickData.frameData ? tickData.frameData : [];
                var count = frames.length;
                var rSum = 0, zSum = 0;
                var cx0 = 300, cy0 = 300; // canvas centre (canvasW/H = 600)

                for (var i = 0; i < count; i++) {
                    var f = frames[i];
                    var x = f.rect ? f.rect._x : 0, y = f.rect ? f.rect._y : 0;
                    var z = f.z != null ? f.z : 0;
                    rSum += Math.hypot(x - cx0, y - cy0);
                    zSum += z;
                }
                var rAvg = count > 0 ? rSum / count : 0;
                var zAvg = count > 0 ? zSum / count : 0;
                var halfAngleDeg = Math.atan2(rAvg, zAvg) * 180 / Math.PI;

                if (_metricsEl) {
                    _metricsEl.setAttribute('data-half-angle-x100', Math.round(halfAngleDeg * 100));
                    _metricsEl.setAttribute('data-active-quanta', count);
                    var spreadNow = runner.setupResult && runner.setupResult.coneEmitterControl
                        ? runner.setupResult.coneEmitterControl.getSpread() : 0;
                    _metricsEl.setAttribute('data-spread-x100', Math.round(spreadNow * 100));
                }

                window.__frqtlConeEmitter.halfAngleDeg  = halfAngleDeg;
                window.__frqtlConeEmitter.activeQuanta  = count;

                if (metrics) {
                    metrics.update({
                        'Active Quanta': count,
                        'Half-angle':    halfAngleDeg,
                        'Tick':          tick
                    });
                }
            }
        });

        runner.createCanvas();
        runner.setup(setupConeEmitter3D, {});

        var ctl = runner.setupResult.coneEmitterControl;
        window.__frqtlConeEmitter.spread = ctl.getSpread();
        window.__frqtlConeEmitter.vz     = ctl.getVz();

        metrics = new ExperimentMetrics('metrics-panel', [
            { name: 'Active Quanta', expected: null, format: function (v) { return String(Math.round(v)); } },
            { name: 'Half-angle',    expected: null, format: function (v) { return v.toFixed(1) + '°'; } },
            { name: 'Tick',          expected: null, format: function (v) { return String(v); } }
        ]);

        // ── Emit toggle ──────────────────────────────────────────────────────
        document.getElementById('ctrl-autofire').addEventListener('change', function (e) {
            ctl.setActive(e.target.checked);
        });

        // ── Live knobs — declared ONCE (CONTROLS), wired to BOTH the standalone
        //    page sliders AND runner.experimentControls (the IDE GYM control
        //    strip). Mirrors g3-lo-collide's idiom exactly. ──────────────────
        var CONTROLS = ctl.controls;
        CONTROLS.forEach(function (c) {
            var slider = document.getElementById('ctrl-' + c.id);
            var out    = document.getElementById('ctrl-' + c.id + '-val');
            if (!slider) return;
            slider.value = c.value;
            if (out) out.textContent = c.fmt(c.value);
            slider.addEventListener('input', function () {
                var v = parseFloat(slider.value);
                if (out) out.textContent = c.fmt(v);
                c.onChange(v);
            });
        });
        runner.experimentControls = CONTROLS;

        // ── Camera orbit control (sugar handle — mirrors particle-walk-3d) ──
        var cam = runner.cameraControl;
        if (window.OrbitBag.hasAngularPose(cam)) {   // az/el sliders: an angular camera only
            document.getElementById('camera-controls').style.display = 'inline-flex';

            // Default view: 'rooftop' (3/4 aerial, az=45/el=45) — shows the ring's
            // x,y extent AND the beam's z-depth simultaneously, so the cone's
            // opening (or the cylinder's parallel walls) is visible from the
            // FIRST frame without any manual drag. Try 'down-barrel' for a pure
            // side profile across the z axis, or 'table-top' to look straight
            // down the beam's own axis.
            cam.setPreset('rooftop');

            var startOrbit = cam.getOrbit();
            var azEl = document.getElementById('cam-azimuth');
            var elEl = document.getElementById('cam-elevation');
            var diEl = document.getElementById('cam-distance');
            azEl.value = Math.round(startOrbit.azimuth);
            elEl.value = Math.round(startOrbit.elevation);
            diEl.value = Math.round(startOrbit.distance);
            document.getElementById('cam-azimuth-val').textContent   = azEl.value;
            document.getElementById('cam-elevation-val').textContent = elEl.value;
            document.getElementById('cam-distance-val').textContent  = diEl.value;
            function _wireOrbit(inputEl, labelId, key) {
                inputEl.addEventListener('input', function () {
                    var v = parseInt(inputEl.value, 10);
                    document.getElementById(labelId).textContent = v;
                    var spec = {}; spec[key] = v;
                    cam.setOrbit(spec);
                });
            }
            _wireOrbit(azEl, 'cam-azimuth-val',   'azimuth');
            _wireOrbit(elEl, 'cam-elevation-val', 'elevation');
            _wireOrbit(diEl, 'cam-distance-val',  'distance');

            function _syncSliders() {
                var o = cam.getOrbit();
                azEl.value = Math.round(o.azimuth);   document.getElementById('cam-azimuth-val').textContent   = azEl.value;
                elEl.value = Math.round(o.elevation); document.getElementById('cam-elevation-val').textContent = elEl.value;
                diEl.value = Math.round(o.distance);  document.getElementById('cam-distance-val').textContent  = diEl.value;
            }
            (cam.presets || []).forEach(function (name) {
                var btn = document.getElementById('cam-preset-' + name);
                if (btn) { btn.addEventListener('click', function () { cam.setPreset(name); _syncSliders(); }); }
            });

            runner.setRateLimits({ fpsLimit: 0, tpsLimit: 120 });
        }

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 on the p5 renderer (its load calls
    // window.setup), else window.setup() (FRAQTL #74).
    window._egptStartSketch();
    </script>
