<body>
    <script>window._egptDefaultEngine = "wasm";
    window._egptEnginePathMap = {"assets/vendor/":"../../8ba141ba/js/lib/","assets/render/":"../../8ba141ba/js/consumers/","assets/models/":"../../8ba141ba/js/models/","compat/providers/":"../../8ba141ba/js/compat/","compat/":"../../8ba141ba/js/compat/","objects/":"../../8ba141ba/js/game/","experiments/_shared/":"../../8ba141ba/experiments/_shared/","experiments/":"../../8ba141ba/experiments/","scenes/":"../../8ba141ba/scenes/","shim/":"../../8ba141ba/ide/"};</script>
    <script>window._egptWasmPkgUrl = new URL("../../8ba141ba/fat/pkg-web/egpt_wasm.js", document.baseURI).href;</script>
    <script>window._egptThreeUrl = new URL("../../8ba141ba/js/lib/three.min.js", document.baseURI).href;</script>

    <!--
    ── render.mesh demo ────────────────────────────────────────────────────────

    THE SCENE is the shipped sketch file scenes/collision-matrix-3d.js — the 3D Collisions Lab:
    7 Dim-6 bodies in a 3×3 Y/Z grid launched head-on along X at speed_prob 1, its own 700-cube
    world stated by its exp.createScene call, its own offset/angle knobs and camera pads. This page
    builds it on a sizeless RecipeContext and adds ONE render choice: every quantum renders as a
    CLONE of an external glTF mesh (Flamingo, DRACO-compressed) via setRenderOption('mesh', …) —
    the "frame → external geometry" worked example. WHICH mesh is a renderer choice; the engine is
    untouched, and the physics is the scene's.
    ─────────────────────────────────────────────────────────────────────────── -->
    <script>window._egptDefaultRenderer = 'three';   /* the 3D display the scene's createScene needs */</script>
    <!-- Opt into the GLTFLoader+DRACOLoader UMD loaders (render-boot loads them after three
         because window._egptMeshLoaders is set). -->
    <script>window._egptMeshLoaders = true;</script>

    <script src="../../8ba141ba/experiments/_shared/stack-boot.js"
        data-page-scripts="
            ../../8ba141ba/scenes/collision-matrix-3d.js
        "></script>

    <div class="experiment-container">
        <div class="experiment-canvas" id="canvas-wrapper"></div>
    </div>

    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    window.setup = function () {
        // The scene file (a page script) installed window.buildExperiment; its co-init call makes
        // the world and the runner.
        var exp = new RecipeContext({ canvasParentId: 'canvas-wrapper', seed: 42 });
        exp.build(window.buildExperiment);
        var runner = exp.runner;
        // render.mesh: route every quantum to an external glTF asset (loaded once, cloned per frame,
        // FAIL-LOUD on load error); it takes priority over the scene's shape. The fixture is
        // DRACO-COMPRESSED, so the demo exercises the full GLTFLoader + DRACOLoader + decoder-WASM
        // path. Resolved via the router's 'assets/models/' key (window._egptResolveFrqtl) — never a
        // hardcoded '/frqtl/...' literal, so it also works under the dist/static layout.
        runner.setRenderOption('mesh', window._egptResolveFrqtl('assets/models/flamingo-draco.glb'));
        runner.setRenderOption('meshScale', 6);   // enlarge clones for a legible demo
        runner.start();
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete promise
    // (every data-page-scripts entry) → window.setup() on the three renderer (FRAQTL #74).
    window._egptStartSketch();
    </script>
</body>
