<!DOCTYPE html>
<!-- Copyright 2023-2026 by Essam Abadir -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EGPT — FX: Smoke</title>
    <link rel="stylesheet" href="../../aec81862/experiments/_shared/experiment-layout.css">
    <style>
        .experiment-controls {
            flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
            padding: 6px 12px; background: #0d0d0d; border-top: 1px solid #2a2a2a; flex-wrap: wrap;
        }
        .experiment-controls label { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .experiment-controls input[type="range"] { width: 100px; cursor: pointer; accent-color: #7ec8e3; }
        .experiment-controls span.val { color: #7ec8e3; min-width: 28px; display: inline-block; text-align: right; }
        .cam-preset { background:#1a1a1a; color:#aaa; border:1px solid #2a2a2a; border-radius:3px; font-size:11px; padding:2px 7px; cursor:pointer; margin:0 2px; }
        .cam-preset:hover { color:#7ec8e3; border-color:#7ec8e3; }
    </style>
</head>
<body>
    <script>window._egptDefaultEngine = "wasm";
    window._egptEnginePathMap = {"assets/vendor/":"../../aec81862/js/lib/","assets/render/":"../../aec81862/js/consumers/","assets/models/":"../../aec81862/js/models/","compat/providers/":"../../aec81862/js/compat/","compat/":"../../aec81862/js/compat/","objects/":"../../aec81862/js/game/","experiments/_shared/":"../../aec81862/experiments/_shared/","experiments/":"../../aec81862/experiments/","scenes/":"../../aec81862/scenes/","shim/":"../../aec81862/ide/"};</script>
    <script>window._egptWasmPkgUrl = new URL("../../aec81862/fat/pkg-web/egpt_wasm.js", document.baseURI).href;</script>
    <script>window._egptThreeUrl = new URL("../../aec81862/js/lib/three.min.js", document.baseURI).href;</script>
    <script>window._egptDefaultRenderer = 'three';   /* the 3D display; the runner tells the provider is3D */</script>

    <!-- setupFxSmoke: Blackbody aggregation mechanic applied to a moving beam.
         withInterQuantumCollisions=true + 3 extra dimensions (voxel size-up ladder)
         lets colliding quanta parent into compound frames with varied rect.w.
         The renderer (three-provider.js) sizes each puff by frame.rect.w (aSize).
         The Bullet's BOUNCE wake compresses quanta → more collisions → bigger frames
         → puff sizes vary → smoke BILLOWS (the billow is DATA, not a sprite trick). -->
    <script>
    window._egptFx = {
        title: 'FX — Smoke',
        setup: 'setupFxSmoke',
        renderDefaults: { smoke: 7 },
        // controls: RETIRED (WS Studio Controls Realignment §7 r2 item 3(b)) — the
        // smoke slider is now mechanically derived from renderCapabilities() by
        // fx-experiment.js's _buildControls. ONE deliberate cosmetic delta: this
        // slider's label was 'puff' here; the shared CAPABILITY_LABELS map now
        // shows 'smoke' (every OTHER fx-* page already used
        // 'smoke' for this same capability — standardized rather than adding a
        // THIRD per-page label table).
        presets: [
            { name: 'Off',    render: { smoke: 0  } },
            { name: 'Wisp',   render: { smoke: 4  } },
            { name: 'Plume',  render: { smoke: 9  } },
            { name: 'Billow', render: { smoke: 14 } }
        ]
    };
    </script>

    <script src="../../aec81862/experiments/_shared/stack-boot.js"
        data-page-scripts="
            ../../aec81862/js/game/objects/Bullet.js,
            ../../aec81862/js/game/setup/setupFxSmoke.js,
            ../../aec81862/experiments/_shared/experiment-metrics.js,
            ../../aec81862/experiments/_shared/fx-experiment.js
        "></script>

    <div class="experiment-container">
        <div class="experiment-canvas" id="canvas-wrapper"></div>
        <div class="experiment-controls">
            <span id="camera-controls" style="display:none; align-items:center; gap:16px;">
                <label title="Orbit the camera horizontally">cam azimuth:
                    <input type="range" id="cam-azimuth" min="-180" max="180" step="1" value="35">
                    <span class="val" id="cam-azimuth-val">35</span></label>
                <label title="Orbit the camera vertically">cam elevation:
                    <input type="range" id="cam-elevation" min="-85" max="85" step="1" value="22">
                    <span class="val" id="cam-elevation-val">22</span></label>
                <label title="Dolly the camera in/out">cam distance:
                    <input type="range" id="cam-distance" min="200" max="2400" step="20" value="960">
                    <span class="val" id="cam-distance-val">960</span></label>
                <span title="Pre-computed perspectives">view:
                    <button type="button" id="cam-preset-table-top" class="cam-preset">table-top</button>
                    <button type="button" id="cam-preset-down-barrel" class="cam-preset">down-barrel</button>
                    <button type="button" id="cam-preset-rooftop" class="cam-preset">rooftop</button>
                </span>
            </span>
        </div>
        <div id="metrics-panel"></div>
    </div>
</body>
</html>
