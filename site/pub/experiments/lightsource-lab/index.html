    /**
     * LightSource Lab — LightSource isolation (I2). Mirrors tunnel-lab's own
     * CONTROLS-array-declared-once idiom (both the static page sliders/selects AND
     * runner.experimentControls, the GYM control-strip capability). source/
     * polarization/count/bore/length are REINIT-CLASS (runner.setup() again — each
     * changes a fundamental construction parameter of the underlying LightSource);
     * wallBehavior is LIVE (setupResult.tunnel.updateBehavior — the stock
     * DirectedTunnel accessor, replica discipline).
     */

    var runner = null, metrics = null, tick = 0;
    // dse-scale DEFAULT (CEO drive #2, 2026-07-14 false-claim correction) — matches
    // tunnel-lab's own default exactly AND LightSource.js's actual sugar default
    // (bore=8, length=16); previously this page silently overrode that default
    // with gun-scale (16/128) on every setup() call — the two labs now genuinely
    // load at the SAME scale, not just in the underlying object's own default.
    // density=10/rate=1 DEFAULT (CEO drive #2 SUSTAIN fix, 2026-07-14) — mirrors
    // tunnel-lab's own sourceDensity/sourceRate defaults EXACTLY; the initial
    // one-shot burst (particleCount) is seeded from the SAME value so it matches
    // every SUBSEQUENT recurring re-placement burst's size.
    var currentBore = 8, currentLength = 16, currentSource = 'particleWalk', currentPolarization = 'random';
    var currentDensity = 10, currentRate = 1;
    // ws-dse-3d AC4 (CEO ruling, "MATCHED CONTROLS -> MATCHED PHYSICS") — matches
    // tunnel-lab's own currentWavelength default exactly (8).
    var currentWavelength = 8;

    var VALID_SOURCES = ['particleWalk', 'emitter'];
    var VALID_POLARIZATIONS = ['random', 'positive', 'negative'];

    function currentOpts() {
        return {
            bore: currentBore, length: currentLength,
            // 3D MODE (CEO drive #2 item 1) — depth = the current bore, mirrors
            // tunnel-lab's own recipe exactly (setupLightSourceLab.js treats this
            // as REINIT-CLASS, same as bore/length).
            depth: currentBore,
            source: currentSource, polarization: currentPolarization,
            // SUSTAIN fix — particleCount seeds the INITIAL one-shot burst (same
            // size as the recurring density below); sourceDensity/sourceRate
            // drive the RECURRING emission for BOTH source modes.
            particleCount: currentDensity,
            sourceDensity: currentDensity, sourceRate: currentRate,
            // ws-dse-3d AC4 — threads into BOTH the initial burst and the
            // recurring sustain spec (setupLightSourceLab.js's own lsOpts.particle
            // + lsOpts.sustain).
            wavelength: currentWavelength,
            wallBehavior: document.getElementById('ctrl-wallbehavior').value,
        };
    }

    function reinit() {
        tick = 0;
        runner.setup(setupLightSourceLab, currentOpts());
        applyCameraForCurrentScale();
    }

    // ── CAMERA DISTANCE PER-SCALE (CEO drive #2, 2026-07-14) — mirrors
    // tunnel-lab's own applyCameraForCurrentScale EXACTLY ("same treatment,
    // layered"; see that file for the full derivation/calibration rationale).
    // 'down-barrel' scales with bore (foreshortened long axis); 'table-top'/
    // 'rooftop' scale with length. Factors calibrated so dse-scale
    // (bore=8,length=16) reproduces the tester-confirmed-working ORIGINAL
    // canvas-based distances (665/910/1050) exactly — zero regression there.
    //
    // GUN-SCALE ROOFTOP FRAMING FIX (tester finding, follow-up) — mirrors
    // tunnel-lab's own fix exactly: pkg-node measured the dispersion cloud's
    // ACTUAL settled radius is essentially SCALE-INDEPENDENT (governed by
    // elapsed-ticks × the engine's fixed 1px/tick speed limit, not tube
    // length), so a length-proportional camera distance massively over-scales
    // for gun-scale (8x farther than the cloud needs). MAX_LENGTH_SCALE_DIM
    // clamps table-top/rooftop's effective scale dimension — a judgment call
    // for gun-scale (optional, non-default); dse-scale (the default) is
    // unaffected (16 is already below the 32 cap).
    //
    // ROOFTOP FRAMING ITERATION 2 (CEO oracle: docs/internal/physics-lab/img/
    // dse/LightSource_Expected_Output_Rooftop.png, a Gun-Chamber shot at sustained
    // alive≈10k) — the length-clamp above is a REAL improvement (32*65.625=2100
    // vs the unclamped 128*65.625=8400) but still ~3.5x farther than the cloud
    // needs: `reference_dispersion_cloud_radius_scale_independent.md` measured
    // the settled cloud's maxRadius at BOTH scales — dse-scale (length=16)
    // ≈645px, gun-scale (length=128, 8x LONGER tube) ≈590px — essentially the
    // SAME absolute radius, exactly as expected since the cloud's spread is
    // elapsed-ticks × the fixed 1px/tick speed limit, not tube geometry. The
    // CEO's own oracle frame (a DIFFERENT scene, Gun Chamber's 128-bore/384-long
    // tube, camera manually dollied in to distance≈580 to fill the frame with
    // the cloud) lands right in that same ≈580-645px band — strong independent
    // confirmation that 'rooftop' framing at ANY scale beyond dse-scale's own
    // reference length should be anchored to the CLOUD's radius, not the tube's.
    // ROOFTOP_CLOUD_DISTANCE=600 sits inside the measured 590-645px band. Gated
    // on `currentLength > 16` (dse-scale's own default) so dse-scale's already-
    // confirmed-working rooftop distance (1050) is BYTE-IDENTICAL — this only
    // changes framing for lengths beyond dse-scale's reference (gun-scale's 128
    // included), where the tube-length formula was the thing overshooting.
    // 'table-top' is NOT touched by this iteration (same clamp mechanism, same
    // residual overshoot at gun-scale — flagged as a follow-up, not fixed here;
    // the CEO's oracle image and this drive are rooftop-specific).
    var CAM_DISTANCE_FACTOR = { 'down-barrel': 83.125, 'table-top': 56.875, 'rooftop': 65.625 };
    var MAX_LENGTH_SCALE_DIM = 32; // 2x dse-scale's own length (16)
    var ROOFTOP_REFERENCE_LENGTH = 16; // dse-scale's own default — below this, unchanged
    var ROOFTOP_CLOUD_DISTANCE = 600;  // anchored to the measured cloud maxRadius (590-645px)
    var currentCamPreset = 'down-barrel';
    function applyCameraForCurrentScale() {
        var cam = runner.cameraControl;
        if (!window.OrbitBag.hasAngularPose(cam)) { return; }   // 3D preset names: an angular camera only
        cam.setPreset(currentCamPreset);
        var o = cam.getOrbit();
        var scaleDim = (currentCamPreset === 'down-barrel')
            ? currentBore
            : Math.min(currentLength, MAX_LENGTH_SCALE_DIM);
        var factor = CAM_DISTANCE_FACTOR[currentCamPreset] || CAM_DISTANCE_FACTOR['down-barrel'];
        var distance = scaleDim * factor;
        if (currentCamPreset === 'rooftop' && currentLength > ROOFTOP_REFERENCE_LENGTH) {
            // Beyond dse-scale's own reference length, the dispersion cloud (not
            // the tube) dominates the 'rooftop' view and its radius does not grow
            // with tube length — anchor to the measured cloud radius instead of
            // continuing to scale (even clamped) with tube length.
            distance = ROOFTOP_CLOUD_DISTANCE;
        }
        cam.setOrbit({ azimuth: o.azimuth, elevation: o.elevation, distance: distance });
    }

    window.setup = function () {
        runner = new FrqtlApp({
            is3D: true,   // a 3D page: perspective + depth (handed to the provider's init)
            canvasParentId: 'canvas-wrapper',
            canvasW: 700, canvasH: 400, seed: 42,
            onTick: function (tickData, setupResult) {
                tick++;
                // C1-fix idiom (ruling_directed_tunnel_lightsource.md): the ONE call
                // any DirectedTunnel/LightSource consumer needs every tick for
                // 'option1' to actually redirect — self-gates on the tunnel's
                // current behavior. LightSource.tunnel is a STOCK DirectedTunnel
                // (replica discipline), so this is byte-identical to tunnel-lab's
                // own wiring.
                if (setupResult && setupResult.tunnel) {
                    setupResult.tunnel.applyRedirectIfActive(tickData);
                }
                if (metrics) {
                    var fd = (tickData && tickData.frameData) ? tickData.frameData : [];
                    var alive = fd.filter(function (f) { return f.isAlive !== false; }).length;
                    metrics.update({ Tick: tick, 'Quanta (alive)': alive });
                }
            }
        });

        runner.createCanvas();
        runner.setRenderOption('shape', 'ball');
        runner.setRenderOption('colorScheme', 'roygbiv');

        // Wavelength slider: clamp `max` to the ONE authority
        // (setupLightSourceLab.MAX_USEFUL_WAVELENGTH — never a hand-typed "16")
        // BEFORE the first runner.setup() call — ws-dse-3d AC4, mirrors
        // tunnel-lab's own O5-class ordering discipline exactly.
        var sliderWl = document.getElementById('ctrl-wavelength');
        sliderWl.max = String(setupLightSourceLab.MAX_USEFUL_WAVELENGTH);

        // Populate #ctrl-wallbehavior's <option>s from DirectedTunnel.BEHAVIORS
        // BEFORE the FIRST runner.setup() call below — currentOpts() reads this
        // <select>'s .value, and the static HTML ships it with ZERO <option>s (by
        // design: options are derived from the one authority, never hand-typed).
        // An empty <select>.value is "" (empty string), NOT undefined, and
        // DirectedTunnel's constructor treats "" as an explicit (invalid) behavior
        // rather than "omitted" — so reading it before population threw
        // `unknown behavior ""` inside window.setup(), UNCAUGHT, which meant
        // runner.start() (the only place window._frqtlApp gets set) never ran
        // and the page was dead from first paint (tester O5 finding, I4 pass).
        var selBehavior = document.getElementById('ctrl-wallbehavior');
        // Label/tooltip text comes from DirectedTunnel.BEHAVIOR_META (ONE authority
        // — CEO drive #2, 2026-07-14: "option1/option2 are non-descript"); the
        // <option>'s VALUE stays the raw wire string ('option1'/'option2'/composable
        // name) so updateBehavior(v) and every other consumer is UNCHANGED — only
        // the human-facing label/tooltip is descriptive. Mirrors tunnel-lab's own
        // idiom exactly (one shared authority, no parallel copy).
        DirectedTunnel.BEHAVIORS.slice().forEach(function (name) {
            var opt = document.createElement('option');
            var meta = DirectedTunnel.BEHAVIOR_META && DirectedTunnel.BEHAVIOR_META[name];
            opt.value = name;
            opt.textContent = meta ? meta.label : name;
            if (meta && meta.description) { opt.title = meta.description; }
            selBehavior.appendChild(opt);
        });
        selBehavior.value = 'option2';

        runner.setup(setupLightSourceLab, currentOpts());

        // ── CONTROLS — declared ONCE, used for BOTH the static page sliders AND
        // runner.experimentControls (the GYM control-strip capability). ──────────
        var CONTROLS = [
            {
                id: 'source', kind: 'enum', label: 'Source', values: VALID_SOURCES.slice(), value: currentSource,
                fmt: function (v) { return v; },
                onChange: function (v) { currentSource = v; reinit(); }
            },
            {
                id: 'polarization', kind: 'enum', label: 'Polarization', values: VALID_POLARIZATIONS.slice(), value: currentPolarization,
                fmt: function (v) { return v; },
                onChange: function (v) { currentPolarization = v; reinit(); }
            },
            {
                // SUSTAIN fix (CEO drive #2) — replaces the old one-shot "count"
                // control; LIVE (mutates setupResult.sourceState.density, no
                // reinit) — mirrors tunnel-lab's own density control exactly.
                id: 'density', kind: 'scalar', label: 'Density', min: 1, max: 30, step: 1, value: currentDensity,
                fmt: function (v) { return String(Math.round(v)); },
                onChange: function (v) { runner.setupResult.sourceState.density = v; }
            },
            {
                id: 'rate', kind: 'scalar', label: 'Rate', min: 1, max: 60, step: 1, value: currentRate,
                fmt: function (v) { return String(Math.round(v)); },
                onChange: function (v) { runner.setupResult.sourceState.rate = v; }
            },
            {
                // ws-dse-3d AC4 (CEO ruling, "MATCHED CONTROLS -> MATCHED PHYSICS") —
                // mirrors tunnel-lab's own wavelength control exactly (same default,
                // same MAX_USEFUL_WAVELENGTH clamp authority). LIVE (mutates
                // setupResult.sourceState.wavelength, no reinit) for BOTH source
                // modes — ws-dse-3d round 2 closes the prior round's deferral:
                // source:'emitter' now also has a live wavelength (setupLightSourceLab
                // .js's sourceState.wavelength accessor delegates to
                // QuantumEmitter.prototype.setWavelength for that mode).
                id: 'wavelength', kind: 'scalar', label: 'Wavelength', min: 1, max: setupLightSourceLab.MAX_USEFUL_WAVELENGTH, step: 1, value: currentWavelength,
                fmt: function (v) { return String(Math.round(v)); },
                onChange: function (v) { currentWavelength = v; runner.setupResult.sourceState.wavelength = v; }
            },
            {
                id: 'bore', kind: 'scalar', label: 'Bore', min: 4, max: 60, step: 1, value: currentBore,
                fmt: function (v) { return String(Math.round(v)); },
                onChange: function (v) { currentBore = v; reinit(); }
            },
            {
                id: 'length', kind: 'scalar', label: 'Length', min: 8, max: 300, step: 1, value: currentLength,
                fmt: function (v) { return String(Math.round(v)); },
                onChange: function (v) { currentLength = v; reinit(); }
            },
            {
                id: 'wallBehavior', kind: 'enum', label: 'Wall behavior',
                values: DirectedTunnel.BEHAVIORS.slice(), value: 'option2',
                // Descriptive label (CEO drive #2) for any host that renders this
                // array (e.g. a future runner.experimentControls strip) — SAME
                // BEHAVIOR_META authority the page's own <select> uses.
                fmt: function (v) { var meta = DirectedTunnel.BEHAVIOR_META && DirectedTunnel.BEHAVIOR_META[v]; return meta ? meta.label : v; },
                onChange: function (v) { runner.setupResult.tunnel.updateBehavior(v); }
            }
        ];

        // (1) Wire the page's own static selects/sliders.
        var selSource = document.getElementById('ctrl-source');
        CONTROLS[0].values.forEach(function (name) {
            var opt = document.createElement('option'); opt.value = name; opt.textContent = name;
            selSource.appendChild(opt);
        });
        selSource.value = CONTROLS[0].value;
        selSource.addEventListener('change', function () { CONTROLS[0].onChange(selSource.value); });

        var selPolarization = document.getElementById('ctrl-polarization');
        CONTROLS[1].values.forEach(function (name) {
            var opt = document.createElement('option'); opt.value = name; opt.textContent = name;
            selPolarization.appendChild(opt);
        });
        selPolarization.value = CONTROLS[1].value;
        selPolarization.addEventListener('change', function () { CONTROLS[1].onChange(selPolarization.value); });

        var sliderDensity = document.getElementById('ctrl-density');
        var lblDensity = document.getElementById('ctrl-density-val');
        sliderDensity.addEventListener('input', function () {
            var v = parseInt(sliderDensity.value, 10); lblDensity.textContent = v; CONTROLS[2].onChange(v);
        });

        var sliderRate = document.getElementById('ctrl-rate');
        var lblRate = document.getElementById('ctrl-rate-val');
        sliderRate.addEventListener('input', function () {
            var v = parseInt(sliderRate.value, 10); lblRate.textContent = v; CONTROLS[3].onChange(v);
        });

        // sliderWl's `.max` was already clamped above (BEFORE the first
        // runner.setup() call) — just wire the input listener here (ws-dse-3d
        // AC4, mirrors tunnel-lab's own wavelength wiring exactly).
        var lblWl = document.getElementById('ctrl-wavelength-val');
        sliderWl.addEventListener('input', function () {
            var v = parseInt(sliderWl.value, 10); lblWl.textContent = v; CONTROLS[4].onChange(v);
        });

        var sliderBore = document.getElementById('ctrl-bore');
        var lblBore = document.getElementById('ctrl-bore-val');
        sliderBore.addEventListener('input', function () {
            var v = parseInt(sliderBore.value, 10); lblBore.textContent = v; CONTROLS[5].onChange(v);
        });

        var sliderLength = document.getElementById('ctrl-length');
        var lblLength = document.getElementById('ctrl-length-val');
        sliderLength.addEventListener('input', function () {
            var v = parseInt(sliderLength.value, 10); lblLength.textContent = v; CONTROLS[6].onChange(v);
        });

        // selBehavior's <option>s were already populated above (BEFORE the first
        // runner.setup() call) from the SAME source CONTROLS[7].values uses
        // (DirectedTunnel.BEHAVIORS) — one authority, never a hand-typed mirror.
        // Just wire the change listener here.
        selBehavior.addEventListener('change', function () { CONTROLS[7].onChange(selBehavior.value); });

        // (2) Expose the SAME controls to the IDE GYM (CompareView capability-checks
        // this — g3-lo-collide/tunnel-lab idiom).
        runner.experimentControls = CONTROLS;

        // ── Presets — both from the tunnel-lab sibling's own table (uniformizing
        // cells at DSE-scale bore=8): 'dse-scale' (8/16, LightSource's actual sugar
        // default, DEFAULT on load — CEO drive #2 false-claim correction) and
        // 'gun-scale' (16/128, one click away). ─────────────────────────────────
        function applyPreset(bore, length) {
            currentBore = bore; currentLength = length;
            sliderBore.value = bore; lblBore.textContent = bore;
            sliderLength.value = length; lblLength.textContent = length;
            reinit();
        }
        document.getElementById('preset-gun-scale').addEventListener('click', function () { applyPreset(16, 128); });
        document.getElementById('preset-dse-scale').addEventListener('click', function () { applyPreset(8, 16); });

        // ── Metrics ──────────────────────────────────────────────────────────────
        metrics = new ExperimentMetrics('metrics-panel', [
            { name: 'Tick', expected: null, format: function (v) { return String(v); } },
            { name: 'Quanta (alive)', expected: null, format: function (v) { return String(v); } }
        ]);

        // ── Camera orbit control (sugar handle — mirrors tunnel-lab/
        // gun-chamber/sphere-emitter-3d EXACTLY) —
        // capability-checked, never renderer-sniffed. This page is 3D-only
        // (three display + is3D above), so `cam` is always present once the
        // three.js provider is live. DEFAULT PRESET is 'down-barrel' (CEO drive
        // #2 — matches `LightSource_Expected_Output_DownTheBarrel.png`'s camera
        // angle; 'rooftop' matches `_Rooftop.png`, one click away). Distance is
        // SCALE-AWARE (applyCameraForCurrentScale, above) — never the
        // renderer's own fixed canvas-based preset distance directly. ────────
        var cam = runner.cameraControl;
        if (window.OrbitBag.hasAngularPose(cam)) {   // 3D preset buttons: an angular camera only
            document.getElementById('camera-controls').style.display = 'inline-flex';
            (cam.presets || []).forEach(function (name) {
                var btn = document.getElementById('cam-preset-' + name);
                if (btn) { btn.addEventListener('click', function () { currentCamPreset = name; applyCameraForCurrentScale(); }); }
            });
            applyCameraForCurrentScale();
        }

        runner.start();
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 on the p5 renderer (its load calls
    // window.setup), else window.setup() (FRAQTL #74).
    window._egptStartSketch();
    </script>
</body>
</html>
