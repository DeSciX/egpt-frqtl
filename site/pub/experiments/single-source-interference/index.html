    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    /**
     * Single-Source Self-Interference (omni, 2D) — Phase-2 dogfood Golden #1.
     *
     * ONE central omni-directional emitter, rendered flat in 2D — the "Wave
     * Interference reduced to a SINGLE source": one radial spray filling a
     * roughly circular region with visible emergent DENSITY STRUCTURE (the
     * particles of opposite charge BRAID, and that braiding IS the concentric
     * self-interference), not a flat uniform disk.
     *
     * MATCH-THE-INITIAL-CONDITIONS (CEO 2026-07-18): to reproduce the old
     * PointSource/setupWaveInterference look with the unified Emitter, the
     * per-leaf CREATION conditions must match — same fundamentalDimension,
     * mass/capacity (via the wavelength arg), CHARGE, momenta and globals →
     * identical Particle Walk → identical picture. The two ICs that were
     * missing (and made both the smooth-spray look AND the inert λ-knob):
     *   1. CHARGE. PointSource passes charge=null → a random ± per leaf
     *      (emitterProgram.js: `universe.random()<0.5?0:1`). The Emitter used to
     *      hardcode charge 0 (all positive) → no braid. Fixed via the new opt-in
     *      `chargeMode:'random'` on setupSphereEmitter3D (byte-identical default).
     *   2. capacity/mass LEVERAGE. PointSource runs at fundamentalDimension=2
     *      (capacity 16) with a wavelength=32 arg (mass 1) → capacity/mass=16, so
     *      per-leaf wavelength = floor(16 × scale) has real leverage. Born at
     *      dim 0 (capacity=mass=1) the ratio is 1 → wavelength = floor(1 × scale),
     *      a near-flat 8–56px response that read as "the knob does nothing".
     *      INSTRUMENTED (pkg-node): dim0 λ 8→56px (Δ48) vs dim2 λ 128→896px
     *      (Δ768) at scale 8→56. This page now matches dim2 + wavelength32 and
     *      boots at the CEO's sweet-spot wavelengthScale 16 (eff λ 256px, two
     *      clear fringe bands with room to separate on a 600px canvas).
     *   3. RING LAUNCH. PointSource seeds particles around a RING, not a point —
     *      single-occupancy forbids many quanta starting on the EXACT same pixel.
     *      Fixed via the opt-in `emissionShell:'surface'` + `innerR:16` (=
     *      PointSource's diameter/2) — seed the START PIXEL on a circle (2D) /
     *      sphere shell (3D). VERIFIED (pkg-node): surface start-radius mean 16.5
     *      (min 12, max 20) vs volume box=0 mean 3.0 (center cluster).
     *
     * REUSE (this page adds ZERO new engine code; the ONLY sugar changes are the
     * opt-in `chargeMode` + `emissionShell`/`innerR` params on the shared factory):
     *   - The emitter is `setupSphereEmitter3D` locked to `preset:'spherical'` +
     *     `is2D:true` + point source. In 2D the ball-rejected velocity sampler
     *     collapses to a DISK of directions (bench S5) — a single omni source,
     *     isomorphic to PointSource's 72 trig rays (integer (vx,vy) in [-R,R] =
     *     the direction ratio; speed always 1px/tick).
     *   - The λ knob is the universe's `wavelengthScale` global, exposed LIVE via
     *     the same `runner.universe.wavelengthScale` setter Particle Walk
     *     uses (consumed live each tick by frame.rs set_wavelength).
     *
     * PHYSICS (zero new physics — canonical-bench SU1). The structure is
     * EMERGENT from many INDEPENDENT charged omni walks, never a computed
     * superposition curve (no field equation, no "constant speed", no Gaussian):
     *   - S5: disk-rejected integer (vx,vy) => near-uniform DISK of directions.
     *     Speed ALWAYS 1px/tick (M1); (vx,vy) is DIRECTION ONLY.
     *   - M4 / Invariant 6B: each leaf is a transverse oscillator, wavelength =
     *     (capacity/mass) × wavelengthScale; charge shifts its spin quadrant
     *     (compute_spin), so opposite charges braid.
     *   - S1: x and y run the identical update rule — the 2D disk is the sphere
     *     emitter's 3D ball with one fewer axis.
     *
     * Engine-agnostic: runs WASM via FrqtlApp + the compat facade.
     */
    var runner    = null;
    var metrics   = null;
    var tick      = 0;
    var _metricsEl = null;

    // Locked golden config — shared by every emitter the manager creates (CEO
    // 2026-07-19 per-emitter-dimension model). Each emitter births its leaves at its
    // OWN leafDimension (the per-emitter dim knob) via makeLeafFrame's explicit level
    // + addDimension (the Blackbody pattern). BASE_FUNDAMENTAL is the universe's
    // fundamental (lowest) dimension, set once at init.
    //
    // WHY BASE_FUNDAMENTAL = DEFAULT_LEAF_DIM = 2 (regression fix + dynamic-fundamental
    // engine, 2026-07-19): the move-gate (Invariant 6A) makes a leaf AT the fundamental
    // "light" (steps P=1 → FAST) REGARDLESS of fullness, and a leaf ABOVE the fundamental
    // steps P=fullness (heavier/SLOWER at low fullness). Measured: dim2/mass1/fullness0.063
    // → |Δ|≈92px/60t (fast full spray) when the fundamental is 2, but |Δ|≈0 (frozen
    // pile-up) when it is 0. So BASE_FUNDAMENTAL is the INIT SEED = the DEFAULT emitter's
    // dimension, so the default is the fast full-canvas red spray while STILL carrying
    // capacity 16 (eff λ 256, the color leverage). The fundamental is DYNAMIC: the engine
    // SELF-LOWERS it to min(allocated dimensions) on addDimension (merged 2026-07-19). So
    // an emitter at a HIGHER dim (dim3/4/5, above the fundamental) is move-gated/slower/
    // redder — the intended observable (dim4 |Δ|=0, eff λ 4096); and adding a LOWER-dim
    // emitter (dim0/1) SELF-LOWERS the fundamental to it (those leaves become at-fundamental
    // FAST, and the previously-fast dim2 leaves re-base to above-fundamental → slower). The
    // page never re-sets the fundamental — every per-emitter dimension goes through
    // addDimension and the engine derives it. chargeMode:'random' → per-leaf ± braiding; emissionShell:'surface' +
    // innerR:16 → RING launch (PointSource topology). fundamentalWaveLength:64 → initial
    // wavelengthScale floor(64/4)=16 (λ sweet spot). burstSize:72 = one PointSource's
    // per-tick rays. `wavelength` is a harmless template — the manager overrides each
    // emitter's mass via setWavelength(massToWl(mass, capacity)) right after creation.
    var DEFAULT_LEAF_DIM = 2;         // the default single emitter's birth dimension (capacity 16, color leverage)
    var BASE_FUNDAMENTAL = DEFAULT_LEAF_DIM; // universe fundamental = default emitter's dim → default is "light"/FAST
    var LOCKED = {
        is2D:            true,
        preset:          'spherical',
        emissionBoxSide: 0,         // (unused in surface mode) — one central source
        emissionShell:   'surface', // RING launch (PointSource topology)
        innerR:          16,        // ring radius (px) = PointSource diameter/2
        fundamentalDimension: BASE_FUNDAMENTAL, // universe base — leaves born at per-emitter leafDimension
        wavelength:      32,        // template only — overridden per-emitter by setWavelength
        chargeMode:      'random',  // per-leaf ± → braiding (THE self-interference)
        fundamentalWaveLength: 64,  // → initial wavelengthScale floor(64/4)=16 (sweet spot)
        burstSize:       72,        // one PointSource's per-tick ray count
        emitEveryTicks:  1
    };

    window.__frqtlSSI = { activeQuanta: 0, wlScale: 16, effWavelength: 0 };

    // PageParams contract (lib/shim/page-params) — the ONE owner of every URL param
    // key name this page reads (?renderer=, ?stepping=). Live-imported from
    // window.PageParams, which stack-boot.js's ENGINE array installs before any page
    // script runs; a named FAIL-LOUD guard (the fx-experiment.js/_getAstSchema pattern),
    // never a raw TypeError and never a hand-typed literal key.
    function _getPageParams() {
        if (typeof window !== 'undefined' && window.PageParams) { return window.PageParams; }
        throw new Error(
            '[single-source-interference] PageParams not available. ' +
            'Ensure lib/shim/page-params/index.js is loaded before this page\'s sketch ' +
            '(stack-boot.js\'s ENGINE array).'
        );
    }

    window.setup = function () {
        _metricsEl = document.getElementById('ssi-metrics');

        // ── 2D vs 3D MODE (renderer + physics dimensionality) ────────────────────────
        // The page booted the three.js display when it loaded with ?renderer=three (the 3D
        // toggle's reinit); three IS the 3D display. is3D drives BOTH:
        //   - the RENDERER (already selected by render-boot: three when is3D, else p5), and
        //   - the PHYSICS dimensionality: LOCKED.is2D = !is3D, so in 3D the emitter's
        //     ball-of-directions actually spreads in z (the SPHERE field), in 2D the disk.
        // Mutated on LOCKED BEFORE any makeEmitter call below so the default + every
        // manager-created emitter is born at the correct dimensionality. Zero new physics
        // (bench SU1): is2D only picks which axes the SAME base-walk/wave rules run on.
        var is3D = (typeof window !== 'undefined' && window.FrqtlDisplay && window.FrqtlDisplay.name() === 'three');
        LOCKED.is2D = !is3D;
        if (_metricsEl) {
            _metricsEl.setAttribute('data-is2d', String(!is3D));
            _metricsEl.setAttribute('data-renderer', is3D ? 'three' : 'p5');
        }

        // ── ?stepping= — THE WALK SAMPLER (ws-walk-unification Bite 1) ────────────────
        // 'fixed'   = deterministic error-accumulator walk (the engine's default): the
        //             along-ray deviation stays BOUNDED, so off-axis fringes stay as crisp
        //             as on-axis ones.
        // 'average' = the historic per-axis Bernoulli walk: same MEAN step (1 px/tick along
        //             the momentum vector), but variance (L1/L2 − 1) px²/tick — zero on-axis,
        //             0.414 at 45° — so the walk diffuses ALONG the ray off-axis and the
        //             2nd/3rd-order rings wash out there while staying sharp on-axis.
        // Both are the SAME physics knob the engine already owns; this page adds none.
        //
        // FERRIED RAW, exactly as read (architect ruling §2.3): no page-side validation, no
        // page-side default, no sanitize. Absent ⇒ the key is never added ⇒ the ENGINE's
        // default applies (one authority for the default). Garbage ⇒ rides through to
        // universe.init(), which throws naming both legal samplers (one validator). The
        // value lands on LOCKED because LOCKED is the opts bag every makeEmitter copies —
        // so the sampler survives ADD/EDIT/DELETE, both presets, localRestart, and the
        // 2D↔3D snapshot restore, all of which re-run initWorld from that same bag.
        var _steppingParam = new URLSearchParams(window.location.search)
            .get(_getPageParams().KEYS.STEPPING);
        if (_steppingParam !== null) { LOCKED.stepping = _steppingParam; }

        // The ACTIVE sampler, for the badge/metrics readout — TRUTH-IN-LABELING: prefer the
        // universe's own RESOLVED read-back (what actually ran) over the URL string; fall
        // back to the value this page DECLARED at init (exact whenever ?stepping= was given
        // — the A/B case); and when nothing was declared, say so rather than COPYING the
        // engine's default value into the page (that default has exactly one home, the
        // engine's own config enum, and a copy here could silently drift from it).
        function _resolvedStepping() {
            var u = runner ? runner.universe : null;
            if (u && u.stepping !== undefined && u.stepping !== null) { return String(u.stepping); }
            if (LOCKED.stepping !== undefined) { return String(LOCKED.stepping); }
            return 'engine-default';
        }

        // ── EMITTER MANAGER STATE (declared before the runner so onTick closes over it) ──
        // Ordered list of registered emitters — each {id, mass, control}; `control` is a
        // setupSphereEmitter3D handle owning its own host tick-fn + dispose. This is the
        // canonical "user-space holds its emitter handles and CRUDs them" pattern on the
        // PRIMITIVE surface (this page builds its parts with the setup factory, so they are not
        // declared objects): the real registry is universe.experimentTickFunctions — add via the
        // factory, remove via control.dispose (the page's own handle).
        var emitters   = [];
        var emitterSeq = 0;
        function primaryControl() { return emitters.length ? emitters[0].control : null; }

        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: 600,
            canvasH: 600,
            seed: 42,
            onTick: function (tickData) {
                tick++;
                var frames = tickData && tickData.frameData ? tickData.frameData : [];
                var count = frames.length;
                window.__frqtlSSI.activeQuanta = count;

                // EFFECTIVE transverse wavelength readout — computed for the SELECTED emitter
                // (multiple emitters at DIFFERENT dimensions coexist, so a single "newest leaf"
                // is ambiguous; the readout tracks the emitter you're editing). effWl =
                // floor((capacity(selectedDim) / max(1, selectedMass)) × wavelengthScale), min 4
                // — the engine's EXACT compute_wavelength from the emitter's own dim+mass (both
                // exact, so it equals the real leaf). Updates live with dimension / mass / λscale.
                var wlScale = (runner.universe && runner.universe.wavelengthScale !== undefined)
                    ? runner.universe.wavelengthScale : 0;
                window.__frqtlSSI.wlScale = wlScale;
                var effWl = updateEffReadout();   // reads selected emitter + live wlScale, updates DOM + data-attrs

                if (_metricsEl) {
                    _metricsEl.setAttribute('data-active-quanta', count);
                    _metricsEl.setAttribute('data-wl-scale', wlScale);
                    _metricsEl.setAttribute('data-emitter-count', emitters.length);
                    // WHICH WALK SAMPLER IS ACTUALLY RUNNING — stamped every tick from the
                    // RESOLVED state (not the URL), so an A/B capture can never be a silent
                    // no-op: the evidence carries the mode it ran under, in the DOM.
                    _metricsEl.setAttribute('data-stepping', _resolvedStepping());
                    var _ctl = primaryControl();
                    if (_ctl) {
                        if (_ctl.getChargeMode) { _metricsEl.setAttribute('data-charge-mode', _ctl.getChargeMode()); }
                        if (_ctl.getEmissionShell) { _metricsEl.setAttribute('data-emission-shell', _ctl.getEmissionShell()); }
                        if (_ctl.getInnerR) { _metricsEl.setAttribute('data-inner-r', _ctl.getInnerR()); }
                    }
                }
                if (metrics) {
                    metrics.update({
                        'Active Quanta': count, 'Tick': tick, 'Eff. λ (px)': effWl,
                        // VISIBLE in the metrics panel (and therefore IN the screenshot) —
                        // an A/B still is self-labeling for the sampler it ran under.
                        'Stepping': _resolvedStepping()
                    });
                }
            }
        });

        runner.createCanvas();

        // ── EMITTER MANAGER (ADD / EDIT / DELETE / LIST) — PER-EMITTER DIMENSION ──────
        // (CEO 2026-07-19 corrected model.) Dimensions are ADDABLE scale LAYERS (like
        // Frames); an emitter births its leaves AT a chosen dimension via makeLeafFrame's
        // explicit level + addDimension (the scenes/blackbody.js pattern). So DIMENSION is
        // PER-EMITTER: each emitter (tick-fn) holds its own dim and emits at that layer, and
        // MULTIPLE emitters at DIFFERENT dimensions COEXIST on one universe (init once at
        // BASE_FUNDAMENTAL = the DEFAULT emitter's dim, so the default is "light"/FAST). The
        // whole emission→wavelength→COLOR pipeline runs per-emitter:
        //   capacity = (2^dim)²                                    (PER-EMITTER dim knob)
        //   mass                                                   (PER-EMITTER, wavelength arg)
        //   effective wavelength = floor((capacity/mass) × wavelengthScale)   (bench M4)
        //   color = LightColor(fullness = mass/capacity)                       (render-intent)
        //   move-gate (Invariant 6A): a leaf AT the fundamental is LIGHT (P=1 → fast)
        //     regardless of fullness — the default dim2 FULL SPRAY; a leaf ABOVE the
        //     fundamental steps P=fullness → heavier/SLOWER at fixed mass — the intended
        //     higher-dimension observable (dim4 barely moves), NOT a bug. The fundamental is
        //     DYNAMIC: the engine SELF-LOWERS it to min(allocated dims) on addDimension, so
        //     adding a LOWER-dim emitter self-lowers the fundamental to it (that emitter
        //     becomes at-fundamental/fast; previously-fast higher leaves re-base to slower).
        // Controls are STAGED (CEO 2026-07-19) — the dimension/mass controls edit PENDING
        // params without live-mutating any emitter; they commit AS A UNIT. Default staged mass
        // = capacity (fullness 1 → moves at c → no pile-up); the user lowers it to see slowdown.
        // Manager actions (built on the page's own emitter list and each handle's dispose —
        // no engine change):
        //   ADD     = new emitter at the STAGED (dim, mass), KEEPS existing → multi-dim coexist.
        //   EDIT    = dispose the SELECTED emitter + re-add at the STAGED (dim, mass) — the
        //             dispose-before-add fix applies HERE so an EDIT replaces in place (no stack).
        //   DELETE  = remove the selected emitter.
        //   RESTART = re-init the universe (CLEARS all particles) + re-register the SAME emitter
        //             set on it — keeps the N tick-fns; distinct from DELETE and ADD/EDIT.
        // Each entry {id, dim, mass, control}. The WORLD is init'd ONCE, by the page (the
        // sketch), at BASE_FUNDAMENTAL — every emitter after that is just another PART on it.
        // STAGED controls (CEO 2026-07-19 — THIS experiment stages-then-applies, unlike the
        // live-hooked ones elsewhere). `stagedDim`/`stagedMass` are the PENDING per-emitter
        // params the dimension dropdown + mass slider edit WITHOUT mutating any live emitter;
        // they commit AS A UNIT via ADD (new emitter) or EDIT (replace the selected one).
        // DEFAULT stagedMass = capacity (fullness=1 → moves at c/P=1 at ANY dimension → no
        // pile-up); the user LOWERS mass to see the slowdown. When the staged dimension
        // changes, stagedMass re-defaults to the new dimension's capacity.
        var stagedDim  = DEFAULT_LEAF_DIM;
        var stagedMass = 0;      // set below to capacityAt(stagedDim)
        var stagedColor = null;  // render.color override ([r,g,b] or null=colorless/scheme-driven)
        // D3 (2026-07-20) — LIVE emit-every-N-ticks applied to EVERY emitter (and inherited by new
        // ones in makeEmitter). Starts at the LOCKED template rate (1 = every tick). Raising it
        // thins the cloud → higher relative brightness at the interference nodes → bands read clearer.
        var liveEmitEveryTicks = (typeof LOCKED.emitEveryTicks === 'number') ? LOCKED.emitEveryTicks : 1;
        var selectedId = null;
        var universeInited = false;
        var dimSel       = document.getElementById('ctrl-dimension');
        var vmassSlider  = document.getElementById('ctrl-vmass');
        var vmassLabel   = document.getElementById('ctrl-vmass-val');
        var masscapVal   = document.getElementById('ctrl-masscap-val');
        var emitterList  = document.getElementById('ctrl-emitter-list');
        var addBtn       = document.getElementById('ctrl-emitter-add');
        var editBtn      = document.getElementById('ctrl-emitter-edit');
        var delBtn       = document.getElementById('ctrl-emitter-del');
        var restartBtn   = document.getElementById('ctrl-emitter-restart');
        var forceRedChk  = document.getElementById('ctrl-force-red');
        var classicBtn   = document.getElementById('ctrl-classic-preset');
        // FORCE-RED sourced from the canonical LightColor (roygbiv red) — reuse the ONE color
        // authority, never a re-implemented map. render.color takes priority over colorScheme.
        var FORCE_RED    = window.LightColor.getRgbBySchemeName('roygbiv', 0);   // [255,0,0]

        // capacityAt(dim) = (2^dim)² — the ONE authority (SustainedSource.capacityAtDimension,
        // loaded on window by stack-boot). Used for STAGED params before any emitter exists.
        function capacityAt(dim) { return window.SustainedSource.capacityAtDimension(dim); }
        function massToWl(mass, cap) { return Math.max(1, Math.round(cap / Math.max(1, mass))); }
        function selectedEntry() {
            for (var i = 0; i < emitters.length; i++) { if (emitters[i].id === selectedId) return emitters[i]; }
            return emitters[0] || null;
        }
        function labelFor(e) { return 'emitter ' + e.id + ' · dim' + e.dim + ' mass' + e.mass; }
        stagedMass = capacityAt(stagedDim);   // default staged mass = capacity (fullness 1)

        // Create ONE emitter that births leaves AT `dim` (per-emitter), on the SHARED
        // universe. THE WORLD STEP IS SEPARATE and runs ONCE (setupSphereEmitter3D.initWorld
        // at BASE_FUNDAMENTAL — a GLOBAL field reset); after that every emitter is just a PART
        // construction (its tick-fn + addDimension(dim), no field wipe). There is no flag: the
        // absence of the world call IS "don't re-init". setWavelength stamps the exact
        // per-emitter mass; the page's `emitters` list holds it.
        function makeEmitter(dim, mass, color, center) {
            var opts = {}; for (var k in LOCKED) { opts[k] = LOCKED[k]; }
            opts.fundamentalDimension = BASE_FUNDAMENTAL;   // universe base (init once)
            opts.leafDimension = dim;                       // THIS emitter's birth dimension
            opts.renderColor = color || null;               // sugar render.color override (no engine)
            // SOURCE POSITION (Bite 3) — absolute canvas px [x,y]. Omitted ⇒ canvas center
            // (byte-identical single-source default). Two-source interference passes explicit
            // ±separation/2 centers so the two rings don't sit on the shared center.
            if (Array.isArray(center)) { opts.center = center.slice(); }
            // WORLD first — once, before the first PART. Later emitters skip it by NOT
            // calling it (that is what deleted the old skipInit flag).
            if (!universeInited) { setupSphereEmitter3D.initWorld(runner.universe, opts); }
            universeInited = true;
            var control = setupSphereEmitter3D(runner.universe, opts).sphereEmitterControl;
            control.setWavelength(massToWl(mass, control.getMaxWavelength()));  // exact per-emitter mass
            control.setEmitEveryTicks(liveEmitEveryTicks);   // D3 — inherit the current live emission rate
            return control;
        }

        // ── Commit staged params AS A UNIT ────────────────────────────────────────────
        function addStagedEmitter() {   // NEW emitter at the STAGED (dim, mass, color) — KEEPS existing (multi-dim)
            var entry = { id: ++emitterSeq, dim: stagedDim, mass: stagedMass, color: stagedColor, center: null,
                          control: makeEmitter(stagedDim, stagedMass, stagedColor, null) };
            emitters.push(entry);
            selectedId = entry.id;
            refreshManagerUI();
        }
        function editSelected() { // apply the STAGED (dim, mass, color) to the SELECTED emitter (replace in place)
            var e = selectedEntry(); if (!e) return;
            e.control.dispose();
            e.dim = stagedDim; e.mass = stagedMass; e.color = stagedColor;
            e.control = makeEmitter(e.dim, e.mass, e.color, e.center);   // preserve this emitter's source position
            refreshManagerUI();
        }
        function deleteSelected() {
            if (emitters.length <= 1) return;   // always keep one source
            var e = selectedEntry(); if (!e) return;
            e.control.dispose();
            emitters = emitters.filter(function (x) { return x.id !== e.id; });
            selectedId = emitters[0] ? emitters[0].id : null;
            var s = selectedEntry(); if (s) { stagedDim = s.dim; stagedMass = s.mass; stagedColor = s.color; }
            refreshManagerUI();
        }
        // LOCAL RESTART — re-init the universe (fresh, CLEARS ALL PARTICLES) and RE-REGISTER
        // the SAME emitter set on it, keeping the N tick-fns running. Distinct from DELETE
        // (removes an emitter) and ADD/EDIT (commit staged params). Preserves each emitter's
        // (id, dim, mass) + the live global λ-scale.
        function localRestart() {
            var wl = (runner.universe && runner.universe.wavelengthScale !== undefined)
                ? runner.universe.wavelengthScale : undefined;
            var specs = emitters.map(function (e) { return { id: e.id, dim: e.dim, mass: e.mass, color: e.color, center: e.center }; });
            emitters.forEach(function (e) { e.control.dispose(); });   // drop old tick-fns
            emitters = [];
            universeInited = false;   // force the next makeEmitter to RE-INIT → fresh universe (clears particles)
            specs.forEach(function (s) {
                emitters.push({ id: s.id, dim: s.dim, mass: s.mass, color: s.color, center: s.center, control: makeEmitter(s.dim, s.mass, s.color, s.center) });
            });
            if (!selectedEntry()) { selectedId = emitters[0] ? emitters[0].id : null; }
            if (wl !== undefined && runner.universe) { runner.universe.wavelengthScale = wl; }  // restore live λ-scale
            var af = document.getElementById('ctrl-autofire');
            if (af) { emitters.forEach(function (e) { e.control.setActive(af.checked); }); }        // preserve emit on/off
            refreshManagerUI();
        }

        // Eff-λ readout for the STAGED params — floor((capacity(stagedDim)/max(1,stagedMass)) ×
        // wlScale), min 4 (the engine's exact compute_wavelength). Shows what ADD/EDIT will make.
        function updateEffReadout() {
            var cap = capacityAt(stagedDim);
            var wlScale = (runner.universe && runner.universe.wavelengthScale !== undefined)
                ? runner.universe.wavelengthScale : 0;
            var effWl = Math.max(4, Math.floor((cap / Math.max(1, stagedMass)) * wlScale));
            var effEl = document.getElementById('ctrl-effwl-val');
            if (effEl) { effEl.textContent = effWl > 0 ? (effWl + 'px') : '—'; }
            if (_metricsEl) { _metricsEl.setAttribute('data-eff-wavelength', effWl); }
            window.__frqtlSSI.effWavelength = effWl;
            return effWl;
        }

        // Re-sync the dimension dropdown + mass slider (max = staged dim's capacity) + readouts +
        // the emitter dropdown + Playwright data-attrs. STAGED params drive the controls;
        // data-selected-* reflect the SELECTED emitter's COMMITTED params (so a staged-but-not-
        // applied change is visibly distinct until ADD/EDIT).
        function refreshManagerUI() {
            var cap = capacityAt(stagedDim);
            stagedMass = Math.max(1, Math.min(cap, stagedMass));
            dimSel.value = String(stagedDim);
            vmassSlider.max = cap;
            vmassSlider.value = stagedMass;
            vmassLabel.textContent = stagedMass;
            masscapVal.textContent = stagedMass + '/' + cap;
            emitterList.innerHTML = '';
            emitters.forEach(function (e) {
                var opt = document.createElement('option');
                opt.value = String(e.id);
                opt.textContent = labelFor(e);
                if (e.id === selectedId) { opt.selected = true; }
                emitterList.appendChild(opt);
            });
            delBtn.disabled = emitters.length <= 1;
            forceRedChk.checked = !!stagedColor;   // sync the color-override checkbox to the staged color
            if (_metricsEl) {
                var sel = selectedEntry();
                _metricsEl.setAttribute('data-fundamental-dimension', stagedDim);   // STAGED dim
                _metricsEl.setAttribute('data-capacity', cap);
                _metricsEl.setAttribute('data-virtual-mass', stagedMass);           // STAGED mass
                _metricsEl.setAttribute('data-emitter-count', emitters.length);
                // Source POSITIONS (Bite 3) — 'x,y|x,y|…' of each emitter's center; a center of
                // null (single-source default) reads as the canvas center. Lets Playwright confirm
                // the two-source preset placed two sources at ±32 px in x.
                _metricsEl.setAttribute('data-source-centers', emitters.map(function (e) {
                    var c = e.control && e.control.getCenter ? e.control.getCenter() : null;
                    return c ? (c[0] + ',' + c[1]) : '';
                }).join('|'));

        var OUTSIDE_OVERVIEW = { azimuth: 45, elevation: 45, distance: 1400 };

        // INSIDE the iframe (chrome=canvas dropped, CompareView 2026-07 ruling), so
        // this is the DRY capability mirror rather than the sole GYM surface — each
        // onChange drives the SAME sugar handle / page state the DOM controls do.
        runner.experimentControls = [
            {
                // Range DERIVED from the DOM slider itself (the ONE authority for this knob's
                // bounds) — a hand-typed {min:4,max:64} here was a mirror that had already
                // drifted from the widened min. Same handle, same state, one range.
                id: 'wlscale', label: 'λ scale (global)',
                min: parseInt(slider.min, 10), max: parseInt(slider.max, 10),
                step: parseInt(slider.step, 10), value: parseInt(slider.value, 10),
                fmt: function (v) { return String(v); },
                onChange: function (v) {
                    label.textContent = v; slider.value = v;
                    if (runner.universe && runner.universe.wavelengthScale !== undefined) {
                        runner.universe.wavelengthScale = v;
                        window.__frqtlSSI.wlScale = v;
                    }
                }
            },
            {
                id: 'dimension', label: 'dimension (staged)', kind: 'select',
                options: ['0', '1', '2', '3', '4', '5'], value: String(DEFAULT_LEAF_DIM),
                fmt: function (v) { return String(v); },
                onChange: function (v) {
                    // STAGE the dim + re-default staged mass to its capacity (commit via ADD/EDIT)
                    stagedDim = parseInt(v, 10); stagedMass = capacityAt(stagedDim); refreshManagerUI();
                }
            },
            {
                id: 'vmass', label: 'virtual mass (staged)', min: 1, max: 16, step: 1, value: capacityAt(DEFAULT_LEAF_DIM),
                fmt: function (v) { return String(v); },
                onChange: function (v) {
                    // STAGE the mass (no live mutation; commit via ADD/EDIT)
                    stagedMass = Math.max(1, Math.min(capacityAt(stagedDim), parseInt(v, 10))); refreshManagerUI();
                }
            },
            {
                // EMISSION RATE (D3) — LIVE emit-every-N-ticks on every emitter (drives applyEmitRate).
                id: 'emitEvery', label: 'emit every (ticks)', min: 1, max: 20, step: 1, value: liveEmitEveryTicks,
                fmt: function (v) { return String(v); },
                onChange: function (v) { applyEmitRate(parseInt(v, 10)); }
            },
            {
                // SHAPE — LIVE render.shape (setRenderOption), same handle the DOM dropdown drives.
                id: 'shape', label: 'shape', kind: 'select',
                options: ['round', 'boxy'], value: 'round',
                fmt: function (v) { return String(v); },
                onChange: function (v) { shapeSel.value = v; applyShape(); }
            }
        ];

        // ── CONTROL-STATE PERSISTENCE ACROSS THE 2D↔3D REINIT (D1, 2026-07-20) ────────
        // The ctrl-3d toggle reloads with ?renderer=three (a REINIT — fresh boot), which otherwise
        // drops every applied setting (the classic preset, the emitter set, wavelengthScale,
        // shape, emission rate). We snapshot the CURRENT applied control state to sessionStorage
        // (keyed to THIS experiment) in the toggle handler, then restore + consume it here on
        // boot — so the SAME self-interference reproduces in 3D. sessionStorage is the cleanest
        // full-snapshot idiom for this page's multi-emitter state (the labs persist only single
        // scalars as URL params — ?depth=/?renderer=three — which doesn't scale to an emitter LIST).
        // One-shot: a normal reload (no toggle) writes nothing, so nothing is restored. A storage
        // failure (private mode) degrades to "not restored" (the pre-D1 behavior) — NOT a silent
        // physics/contract fallback, so a best-effort try/catch is correct here.
        var SNAP_KEY = 'frqtl.single-source-interference.snapshot';
        function captureSnapshot() {
            var af0 = document.getElementById('ctrl-autofire');
            var snap = {
                v: 1,
                wlScale: (runner.universe && runner.universe.wavelengthScale !== undefined)
                    ? runner.universe.wavelengthScale : undefined,
                shape:      shapeSel ? shapeSel.value : undefined,
                emitRate:   liveEmitEveryTicks,
                autofire:   af0 ? af0.checked : true,
                stagedDim:  stagedDim,
                stagedMass: stagedMass,
                stagedColor: stagedColor,
                emitters:   emitters.map(function (e) { return { dim: e.dim, mass: e.mass, color: e.color || null, center: e.center || null }; }),
                selectedIndex: (function () { for (var i = 0; i < emitters.length; i++) { if (emitters[i].id === selectedId) return i; } return 0; })()
            };
            // Camera framing across the 2D↔3D reinit: persist the orbit of the camera the
            // CameraControls sugar drives — the ANGULAR camera only (restored through the same
            // widget below). A 2D pose is not carried: its `distance` is a visible height, a
            // different quantity from the 3D eye distance it would be restored into.
            if (camControls.mounted) { snap.camOrbit = camControls.getState(); }
            return snap;
        }
        function persistSnapshotForToggle() {
            try {
                if (typeof sessionStorage !== 'undefined') {
                    sessionStorage.setItem(SNAP_KEY, JSON.stringify(captureSnapshot()));
                }
            } catch (e) { /* storage unavailable → state simply isn't preserved (pre-D1 behavior) */ }
        }
        function readAndConsumeSnapshot() {
            if (typeof sessionStorage === 'undefined') { return null; }
            var raw;
            try { raw = sessionStorage.getItem(SNAP_KEY); } catch (e) { return null; }
            if (!raw) { return null; }
            try { sessionStorage.removeItem(SNAP_KEY); } catch (e) { /* consume best-effort */ }
            try { return JSON.parse(raw); } catch (e) { return null; }
        }
        function applySnapshot(snap) {
            if (!snap) { return; }
            if (typeof snap.wlScale === 'number' && runner.universe && runner.universe.wavelengthScale !== undefined) {
                runner.universe.wavelengthScale = snap.wlScale;
                window.__frqtlSSI.wlScale = snap.wlScale;
                if (slider) { slider.value = snap.wlScale; } if (label) { label.textContent = snap.wlScale; }
            }
            if (typeof snap.stagedDim === 'number')  { stagedDim  = snap.stagedDim; }
            if (typeof snap.stagedMass === 'number') { stagedMass = snap.stagedMass; }
            stagedColor = snap.stagedColor || null;
            // Rebuild the committed emitter set on a FRESH universe (mirrors localRestart).
            if (Array.isArray(snap.emitters) && snap.emitters.length) {
                emitters.forEach(function (e) { e.control.dispose(); });
                emitters = []; universeInited = false;
                snap.emitters.forEach(function (s) {
                    emitters.push({ id: ++emitterSeq, dim: s.dim, mass: s.mass, color: s.color || null, center: s.center || null,
                                    control: makeEmitter(s.dim, s.mass, s.color || null, s.center || null) });
                });
                var idx = (typeof snap.selectedIndex === 'number' && snap.selectedIndex < emitters.length) ? snap.selectedIndex : 0;
                selectedId = emitters[idx] ? emitters[idx].id : (emitters[0] ? emitters[0].id : null);
                // makeEmitter re-inited the universe (wiped wavelengthScale) → re-apply the saved λ-scale.
                if (typeof snap.wlScale === 'number' && runner.universe && runner.universe.wavelengthScale !== undefined) {
                    runner.universe.wavelengthScale = snap.wlScale;
                }
            }
            if (typeof snap.emitRate === 'number') { applyEmitRate(snap.emitRate); }   // D3 (also re-stamps every emitter)
            var af = document.getElementById('ctrl-autofire');
            if (af && typeof snap.autofire === 'boolean') {
                af.checked = snap.autofire;
                emitters.forEach(function (e) { e.control.setActive(snap.autofire); });
            }
            if (snap.shape && shapeSel) { shapeSel.value = snap.shape; }   // applyShape() below applies it
            refreshManagerUI();
            // Restore the camera framing through the CameraControls sugar (applies the
            // saved orbit to runner.cameraControl + republishes window.__frqtlCamera).
            if (camControls.mounted && snap.camOrbit) { camControls.setState(snap.camOrbit); }
            if (_metricsEl) { _metricsEl.setAttribute('data-restored', 'true'); }
        }
        applySnapshot(readAndConsumeSnapshot());

        applyShape();   // apply the default (or restored) shape + stamp data-render-shape
        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 on the p5 renderer (its load calls
    // window.setup), else window.setup() (FRAQTL #74).
    window._egptStartSketch();
    </script>
</body>
</html>
