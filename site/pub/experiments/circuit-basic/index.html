<head>

    <title>EGPT — Circuit Basic</title>

</head>
<body>

    <!-- WASM pkg URL (resolved relative to this page) -->
    <script>window._egptDefaultEngine = "wasm";
    window._egptEnginePathMap = {"assets/vendor/":"../../90da229b/js/lib/","assets/render/":"../../90da229b/js/consumers/","assets/models/":"../../90da229b/js/models/","compat/providers/":"../../90da229b/js/compat/","compat/":"../../90da229b/js/compat/","objects/":"../../90da229b/js/game/","experiments/_shared/":"../../90da229b/experiments/_shared/","experiments/":"../../90da229b/experiments/","shim/":"../../90da229b/ide/"};</script>
    <script>window._egptWasmPkgUrl = new URL("../../90da229b/fat/pkg-web/egpt_wasm.js", document.baseURI).href;</script>

    <!-- Canonical shared loader: engine + renderer + game layer in ONE order.
         CircuitProbe.js is part of the canonical game layer (already in stack-boot).
         data-page-scripts lists per-page extras loaded after FrqtlApp. -->
    <script src="../../90da229b/experiments/_shared/stack-boot.js"
        data-page-scripts="
            ../../90da229b/js/game/setup/setupCircuitBasic.js,
            ../../90da229b/experiments/_shared/experiment-metrics.js
        "></script>

    <!-- Page structure -->
    <div class="experiment-container">
        <div class="experiment-canvas" id="canvas-container"></div>
        <div id="metrics-panel"></div>
    </div>

    <!-- Experiment sketch -->
    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    /**
     * Circuit Basic — canonical per-experiment page.
     * Engine-agnostic: runs JS or WASM identically via FrqtlApp + the
     * compat façade. Engine is chosen by ?engine= and boots fail-loud (engine-boot.js).
     * Renderer is chosen by ?renderer= and boots fail-loud (render-boot.js).
     */

    var CANVAS_W = 600;
    var CANVAS_H = 600;

    var runner   = null;
    var metrics  = null;
    var tickCount = 0;
    var sumBefore = 0;
    var sumAfter  = 0;
    var flowSamples = 0;

    window.setup = function () {
        runner = new FrqtlApp({
            canvasParentId: 'canvas-container',
            canvasW: CANVAS_W,
            canvasH: CANVAS_H,
            seed: 42,
            onTick: function (tickData, setupResult) {
                tickCount++;

                if (metrics && setupResult) {
                    var probes = setupResult.probes;
                    var before = probes && probes.before_resistor
                        ? probes.before_resistor.getLastCount() : 0;
                    var after = probes && probes.after_resistor
                        ? probes.after_resistor.getLastCount() : 0;

                    sumBefore += before;
                    sumAfter  += after;
                    flowSamples++;
                    var avgBefore = sumBefore / flowSamples;
                    var avgAfter  = sumAfter / flowSamples;
                    var avgRatio  = avgAfter > 0 ? (avgBefore / avgAfter) : 0;

                    var aq = runner.universe.activeQuanta;

                    var batteryOn = setupResult.battery
                        ? setupResult.battery.isEnabled()
                        : true;

                    metrics.update({
                        'Tick': tickCount,
                        'Active Quanta': aq,
                        'Flow before (lifetime avg)': avgBefore,
                        'Flow after (lifetime avg)': avgAfter,
                        'Ohm ratio (lifetime avg)': avgRatio,
                        'Battery': batteryOn ? 'ON' : 'OFF'
                    });
                }
            }
        });

        runner.createCanvas();
        var result = runner.setup(setupCircuitBasic, {
            wireWidth: 10,
            amperage: 1,
            voltage: 2,
            resistorWidth: 4
        });

        metrics = new ExperimentMetrics('metrics-panel', [
            { name: 'Tick', expected: null, format: function (v) { return v; } },
            { name: 'Active Quanta', expected: null, format: function (v) { return v; } },
            { name: 'Flow before (lifetime avg)', expected: '~14.8 / tick',
              format: function (v) { return v.toFixed(2); } },
            { name: 'Flow after (lifetime avg)', expected: '~6.1 / tick',
              format: function (v) { return v.toFixed(2); } },
            { name: 'Ohm ratio (lifetime avg)', expected: '~2.5× (10px / 4px)',
              format: function (v) { return v.toFixed(2) + '×'; } },
            { name: 'Battery', expected: null, format: function (v) { return v; } }
        ]);

        buildControls(result);
        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
    };

    function buildControls(setupResult) {
        var container = document.getElementById('metrics-panel');

        var ctrlDiv = document.createElement('div');
        ctrlDiv.style.cssText = [
            'padding: 6px 12px',
            'background: #141414',
            'border-top: 1px solid #2a2a2a',
            'display: flex',
            'align-items: center',
            'gap: 12px'
        ].join(';');

        var btn = document.createElement('button');
        btn.textContent = 'Battery: ON';
        btn.style.cssText = [
            'background: #1e3a1e',
            'color: #6aaa6a',
            'border: 1px solid #2e5a2e',
            'font-family: Courier New, monospace',
            'font-size: 12px',
            'padding: 4px 10px',
            'cursor: pointer',
            'border-radius: 3px'
        ].join(';');

        btn.addEventListener('click', function () {
            if (!setupResult || !setupResult.battery) return;
            var isOn = setupResult.battery.isEnabled();
            setupResult.battery.setEnabled(!isOn);
            if (!isOn) {
                btn.textContent = 'Battery: ON';
                btn.style.background = '#1e3a1e';
                btn.style.color = '#6aaa6a';
                btn.style.borderColor = '#2e5a2e';
            } else {
                btn.textContent = 'Battery: OFF';
                btn.style.background = '#3a1e1e';
                btn.style.color = '#aa6a6a';
                btn.style.borderColor = '#5a2e2e';
            }
        });

        ctrlDiv.appendChild(btn);

        var label = document.createElement('span');
        label.textContent = 'Wire: 10px | Resistor: 4px | Voltage: 2 | Amperage: 1 amp (10 quanta/tick)';
        label.style.cssText = 'color: #666; font-size: 11px; font-family: Courier New, monospace;';
        ctrlDiv.appendChild(label);

        container.appendChild(ctrlDiv);
    }

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 (its load calls
    // window.setup) on every renderer (FRAQTL #74).
    window._egptStartSketch({ p5: 'always' });
    </script>
</body>
</html>
