        <div class="experiment-controls">

            <label title="transverse OFFSET (px): A below / B above the lane → glancing, off-axis hit">

                <input type="range" id="ctrl-offset" min="0" max="48" step="4" value="0">
                <span class="val" id="ctrl-offset-val">0</span>

            <label title="approach ANGLE (converging vy): A up / B down → x AND y momentum at impact">

                <input type="range" id="ctrl-angle" min="0" max="1" step="0.1" value="0">
                <span class="val" id="ctrl-angle-val">0.0</span>

            <span class="legend"><b class="a">&#9632;</b> A (&rarr;) &nbsp; <b class="b">&#9632;</b> B (&larr;) &nbsp; Dim-6 voxels (64 px)</span>
            <span class="lane-desc">
                7 lanes (log scale) &mdash;
                L1 &rho;&asymp;0.00024 &nbsp;|&nbsp;
                L2 &rho;&asymp;0.002 &nbsp;|&nbsp;
                L3 &rho;&asymp;0.016 &nbsp;|&nbsp;
                L4 &rho;&asymp;0.125 &nbsp;|&nbsp;
                L5 &rho;=0.25 &nbsp;|&nbsp;
                L6 &rho;=0.5 &nbsp;|&nbsp;
                L7 &rho;=1.0

        <!-- Bite 3 Stage 2 Layer A demo mount: an ADDITIONAL consumer of the

        <div id="controls-panel-mount" class="experiment-controls" title="frqtl-controls-panel demo (same-page / in-app placement)"></div>
        <!-- Bite 3 Stage 2 Layer B demo mount (Rule-0 oracle): a STANDALONE
             frqtl-control-slider — OUTSIDE both strips above — driving the
             SAME registered 'angle' control directly (in-app, no panel, no
             RPC). Three independent consumers of ONE declared-once control:

             this standalone widget — dragging ANY of them moves the sim. -->
        <div id="standalone-control-mount" class="experiment-controls" title="frqtl-control-slider demo (standalone, in-app placement)"></div>
        <!-- WS gym-controls-as-sugar FULL CONVERGENCE Stage ii item 7 (Rule-0 oracle):
             a SECOND standalone frqtl-control-slider, driving a bind-only control (no
             onChange — its ONLY write path is bind.set()) via the decoupled
             opts.initial/onInput path (onInput calls the panel's SAME dispatch()).
             frqtl-control-sync.js reconciles this widget + the panel's own row for
             the SAME control on every tick (rAF-coalesced, skip-if-unchanged) — drag
             EITHER one and, within a frame or so, the other follows. -->
        <div id="sync-demo-mount" class="experiment-controls" title="frqtl-control-sync demo (bind-only lane-4 mass, reconciled every tick)"></div>
        <div id="metrics-panel"></div>
    </div>

    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    /**
     * Collision Matrix — 7-lane log-scale density sweep (masses 2^0,2^3,2^6,2^9,2^10,2^11,2^12).
     *
     * LIVE knobs (Blackbody pattern, no reload): offset (transverse launch separation → glancing)
     * and angle (converging vy → x AND y momentum at impact). Declared once and used for BOTH the
     * page sliders AND runner.experimentControls (the GYM hides page controls under chrome=canvas).
     * Reset re-seats every lane at the current offset/angle.
     *
     * Gap metric per lane: signed distance between A.x and B.x (|bx - ax| - voxel
     * gives interpenetration depth when negative; gap > voxel means separated).
     */

    var runner = null, metrics = null, tick = 0;

    function bodyX(fd, qid) {
        var f = fd.find(function (g) { return g.id === qid; });
        if (!f) return 0;
        return f.rect ? f.rect._x : (f.x !== undefined ? f.x : 0);
    }

    window.setup = function () {
        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: 700, canvasH: 700, seed: 42,
            onTick: function (tickData) {
                tick++;
                var res = runner.setupResult || {};
                var lanes = res.lanes || [];
                var voxel = res.voxel || 64;
                var fd = (tickData && tickData.frameData) ? tickData.frameData : [];

                // Per-lane gap = |bx - ax|. When < voxel the boxes overlap (interpenetrate).
                var vals = { 'Tick': tick };
                lanes.forEach(function (lane) {
                    var ax = bodyX(fd, lane.aQid);
                    var bx = bodyX(fd, lane.bQid);
                    // Gap between box EDGES: centre-to-centre minus one voxel width.
                    // Positive = separated; negative = interpenetrating; ~0 = abutting.
                    var gap = Math.abs(bx - ax) - voxel;
                    vals[lane.name + ' gap'] = gap;
                });
                if (metrics) { metrics.update(vals); }

                // WS gym-controls-as-sugar FULL CONVERGENCE Stage ii item 4 — the ONE
                // opt-in line a page adds to its OWN existing onTick to wire the
                // 'tick' sync trigger (rAF-coalesced inside frqtl-control-sync.js;
                // this call itself is cheap even at 60 calls/sec). controlSync is
                // assigned further down in setup() but is already live by the time
                // onTick actually fires (ticking starts only after runner.start()).
                if (typeof controlSync !== 'undefined' && controlSync) { controlSync.notify('tick'); }
            }
        });
        runner.createCanvas();
        // Shape + colorScheme as first-class render-option DEFAULTS (the preset path).
        // 'box' makes the Dim-6 voxels read as solid squares so lanes are clearly distinct.
        // 'roygbiv' maps fullness→frequency-spectrum: sparse (low mass) → red, dense → violet,
        // so the LOW×LOW lane renders visually redder (dim, sparse) and HH renders violet (dense).
        runner.setRenderOption('shape', 'box');
        runner.setRenderOption('colorScheme', 'roygbiv');
        runner.setup(setupCollisionMatrix, { level: 6 });

        var ctl = runner.setupResult.matrixControl;
        var lanes = runner.setupResult.lanes || [];

        // Reset button: re-seat all 14 bodies via property accessors (no reload).
        document.getElementById('reset').addEventListener('click', function () {
            tick = 0;
            ctl.reset();
        });

        // ── Offset/angle switch — declared ONCE, drives BOTH the page sliders AND the GYM
        // (runner.experimentControls; chrome=canvas hides the page controls so the GYM needs the
        // runner capability — same idiom as g3-lo-collide). The density sweep (per lane) × this
        // offset/angle slider = the "offset angle combinations" that exercise the engine's SEPARATE
        // per-axis momentum buckets (inc_x vs inc_y) and the per-axis contact-cross-section ceiling.
        var CONTROLS = [
            { id: 'offset', label: 'offset', min: 0, max: 48, step: 4,   value: 0,
              fmt: function (v) { return String(v); },        onChange: function (v) { tick = 0; ctl.setOffset(v); } },
            { id: 'angle',  label: 'angle',  min: 0, max: 1,  step: 0.1, value: 0,
              fmt: function (v) { return v.toFixed(1); },      onChange: function (v) { tick = 0; ctl.setAngle(v); } }
        ];
        CONTROLS.forEach(function (c) {
            var slider = document.getElementById('ctrl-' + c.id);
            var out    = document.getElementById('ctrl-' + c.id + '-val');
            if (!slider) return;
            slider.addEventListener('input', function () {
                var v = parseFloat(slider.value);
                if (out) out.textContent = c.fmt(v);
                c.onChange(v);
            });
        });
        runner.experimentControls = CONTROLS;

        // ── Bite 3 Stage 2 Layer A demo mount (Rule-0 oracle): register the
        // SAME CONTROLS array (unmodified above — "declare once, consume
        // everywhere") into a lib/shim/controls registry instance, expose it
        // (in-app discovery + cross-frame postMessage responder), and mount
        // an ADDITIONAL panel beside the canvas. `kind:'scalar'` is supplied
        // HERE, at the point of registering into the Bite-1 contract — the
        // page's own CONTROLS declaration above is untouched (it predates the
        // contract; adding `kind` there would be "rebuilding the page's own
        // sliders", which this bite explicitly must not do).
        //
        // ── WS gym-controls-as-sugar FULL CONVERGENCE, Stage ii item 7 (Rule-0
        // oracle for the tester): neither offset NOR angle has a coherent
        // frame-property read-back (both reseat ALL 14 bodies via
        // matrixControl.setOffset/setAngle, not a 1:1 prop write) — per the
        // author-side coherence rule, a NEW bind-only control is added instead
        // of forcing a bind onto either: a direct mass slider on lane 4's body A
        // (mass=512, the density the physics doc already calls out as "the
        // transition reads clearly here"), bound via {object,prop} straight to
        // setFrameProperty/getFrameProperty — no onChange at all, bind is its
        // ONLY write path (exactly the descriptor shape this build makes work).
        if (window.ControlRegistry && window.FrqtlControlsPanel) {
            var controlsPanelRegistry = window.ControlRegistry.makeControlRegistry();

            var lane4 = lanes[3]; // mass=512 (LANE_MASSES[3]) — density 0.125, "the transition reads clearly here"
            if (lane4) { controlsPanelRegistry.registerObject('lane4-bodyA', lane4.aQid, 'Frame'); }

            var registeredControls = CONTROLS.map(function (c) {
                return Object.assign({ kind: 'scalar' }, c);
            });
            if (lane4) {
                registeredControls.push({
                    kind: 'scalar', id: 'lane4Mass', label: 'L4 mass', min: 1, max: 4096, step: 1,
                    value: lane4.mass, fmt: function (v) { return String(v) + ' (of 4096)'; },
                    bind: { object: 'lane4-bodyA', prop: 'mass' } // bind-only — NO onChange
                });
            }
            controlsPanelRegistry.registerControls('collision-matrix', registeredControls);

            // universe threaded in so the bind-only control's set()/get() can
            // route through setFrameProperty/getFrameProperty (exposeRegistry's
            // FULL CONVERGENCE signature change).
            window.FrqtlControlsPanel.exposeRegistry(controlsPanelRegistry, { universe: runner.universe });
            var controlsPanelMount = document.getElementById('controls-panel-mount');
            if (controlsPanelMount) {
                // .ready should never reject here (same-window, registry just
                // built above) — .catch is a no-op safety net against an
                // unhandled-rejection console warning, not swallowed error
                // handling (mount() already renders the error text into the
                // host element on failure).
                window.FrqtlControlsPanel.mount(controlsPanelMount, {
                    mode: 'in-app', name: 'collision-matrix', registry: controlsPanelRegistry
                }).ready.catch(function () {});
            }

            // ── Bite 3 Stage 2 Layer B demo mount (Rule-0 oracle): a
            // STANDALONE frqtl-control-slider, OUTSIDE both strips above,
            // driving the SAME REGISTERED 'angle' descriptor directly
            // (in-app: no panel, no RPC — frqtl-control-slider's
            // opts.descriptor path calls descriptor.onChange() itself). This
            // is the THIRD independent consumer of the ONE declared-once
            // 'angle' control (the page's own #ctrl-angle slider and the
            // panel's row are the other two) — proves "declare once, consume
            // everywhere" scales to 3 simultaneous widgets, not just 2.
            if (window.FrqtlControlSlider) {
                var angleDescriptor = controlsPanelRegistry.getControls('collision-matrix')
                    .filter(function (c) { return c.id === 'angle'; })[0];
                var standaloneMount = document.getElementById('standalone-control-mount');
                if (angleDescriptor && standaloneMount) {
                    window.FrqtlControlSlider.mount(standaloneMount, { descriptor: angleDescriptor });
                }
            }

            // ── FULL CONVERGENCE Stage ii item 7: two STANDALONE widgets for the
            // bind-only 'lane4Mass' control (a bind-only descriptor cannot use
            // opts.descriptor — frqtl-control-slider.js FAILS LOUD on that; it
            // must go through the decoupled opts.initial/onInput path, with
            // onInput calling the panel's SAME dispatch() — the identical
            // single dispatch point the in-app/RPC paths already share) — PLUS
            // frqtl-control-sync.js reconciling both of them (and the panel's
            // own auto-rendered row above) every tick. Drag EITHER standalone
            // widget: the bind executes immediately (live mass change); within
            // one rAF-coalesced tick, the OTHER standalone widget's display
            // catches up — the "batting a sun around" case with 2 independent
            // writers of the SAME control.
            if (lane4 && window.FrqtlControlSlider && window.FrqtlControlSync) {
                var syncMount = document.getElementById('sync-demo-mount');
                var lane4Initial = controlsPanelRegistry.getControls('collision-matrix')
                    .filter(function (c) { return c.id === 'lane4Mass'; })[0];
                function makeSyncWidget(labelSuffix) {
                    var initial = {
                        id: lane4Initial.id, label: lane4Initial.label + labelSuffix,
                        min: lane4Initial.min, max: lane4Initial.max, step: lane4Initial.step,
                        value: lane4Initial.value, valueText: lane4Initial.fmt(lane4Initial.value)
                    };
                    return window.FrqtlControlSlider.mount(syncMount, {
                        initial: initial,
                        onInput: function (v) {
                            return window.FrqtlControlsPanel.dispatch(
                                controlsPanelRegistry, 'setControlValue', ['collision-matrix', 'lane4Mass', v]);
                        }
                    });
                }
                if (syncMount && lane4Initial) {
                    var syncWidgetA = makeSyncWidget(' (A)');
                    var syncWidgetB = makeSyncWidget(' (B)');

                    var controlSync = window.FrqtlControlSync.makeControlSync({
                        name: 'collision-matrix', registry: controlsPanelRegistry, trigger: 'tick'
                    });
                    controlSync.register('lane4Mass', syncWidgetA);
                    controlSync.register('lane4Mass', syncWidgetB);
                    window._collisionMatrixSync = controlSync; // discoverable for the tester, mirrors window._frqtlApp
                }
            }
        }

        var metricDefs = [
            { name: 'Tick', expected: null, format: function (v) { return String(v); } }
        ].concat(lanes.map(function (lane) {
            return {
                name: lane.name + ' gap',
                // Expected gap at initial state: bx0 - ax0 - voxel > 0 (boxes start separated).
                expected: '> 0 (sep)',
                format: function (v) { return v.toFixed(0) + ' px'; }
            };
        }));

        metrics = new ExperimentMetrics('metrics-panel', metricDefs);

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 on the p5 renderer (its load calls
    // window.setup), else window.setup() (FRAQTL #74).
    window._egptStartSketch();
    </script>
