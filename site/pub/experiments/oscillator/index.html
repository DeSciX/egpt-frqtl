    <!-- Experiment sketch -->
    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    /**
     * Oscillator — canonical per-experiment page.
     * Three-level frame hierarchy: observer > oscillator > quantum.
     * The quantum random-walks inside the oscillator; compress() pulls it
     * toward the center; the oscillator moves inside the observer, producing
     * an emergent wave pattern.
     *
     * Engine-agnostic: ?engine=js and ?engine=wasm both boot and run.
     * Physics divergence between engines is accepted and tracked separately.
     *
     * Renderer chosen by ?renderer= (render-boot.js).
     */
    var runner  = null;
    var metrics = null;
    var tick    = 0;

    window.setup = function () {
        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: 600,
            canvasH: 600,
            seed: 42,
            onTick: function () {
                tick++;
                metrics.update({ 'Active Quanta': runner.universe.activeQuanta, 'Tick': tick });
            }
        });
        runner.createCanvas();
        runner.setup(setupOscillator, {});

        metrics = new ExperimentMetrics('metrics-panel', [
            { name: 'Active Quanta', expected: null, format: function (v) { return String(Math.round(v)); } },
            { name: 'Tick',          expected: null, format: function (v) { return String(v); } }
        ]);

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 (its load calls
    // window.setup) on every renderer (FRAQTL #74).
    window._egptStartSketch({ p5: 'always' });
    </script>
