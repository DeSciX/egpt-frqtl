    <!-- Experiment sketch -->
    <script>
    /* Copyright 2023-2026 by Essam Abadir */

    /**
     * Sphere Emitter 3D — canonical per-experiment page.
     *
     * A spherical "sun" emitter: uniform-DIRECTION emission via ball-rejected
     * integer velocity sampling (CEO-ratified model, 2026-07-17). Speed is
     * ALWAYS 1px/tick (bench M1) — (vx,vy,vz) is DIRECTION ONLY. See
     * lib/frqtl/objects/setup/setupSphereEmitter3D.js for the full physics
     * note and the canonical-bench S4/S5 entries for the measured
     * engine-realized angular-uniformity finding.
     *
     * PHASE 1 DOGFOOD REBUILD (2026-07-18, two iterations): this ONE page +
     * setup factory reproduces every member of the old "Particle Walk"
     * family as PRESETS — sun (spherical, box=0), lightbulb (spherical,
     * box>0), laser (a diverging beam — see setupSphereEmitter3D.js's preset
     * docs), and (iteration 2, CEO's "Option 1" golden-CHARACTER fix)
     * particle-walk (a FAITHFUL reproduction: pure-forward +x drift, no
     * divergence, from a flat line/disk source — the transverse wave alone
     * makes the waviness) — plus the "&lambda; demo" toggle (dials
     * fundamentalDimension so the wavelength/mass knob produces a genuine
     * mass<capacity ratio) for the r0/r1 unique-rational-wavelength recipe
     * from docs/internal/physics-lab/intuition/README.md. In 2D mode the camera defaults
     * to a FLAT straight-on view of the x-y plane (azimuth=180,elevation=0 —
     * see `_applyDefaultCameraOrbit` below), matching the old flat p5 2D
     * canvas rather than a diagonally-projected 3D orbit. Zero new physics
     * (SU1) — see setupSphereEmitter3D.js's Layer 2 docs for the full
     * composition.
     *
     * Engine-agnostic: runs WASM via FrqtlApp + the compat facade.
     * Zero new physics (canonical-bench SU1) — pure composition of M1/M5
     * (speed fixed, velocity conserved) + frame.rs's own L2-normalized
     * base-walk ratio (the "sample-in-ball, normalize" recipe realized for
     * free by the engine's existing stepping rule) + S1 (axes identical).
     */
    var runner    = null;
    var metrics   = null;
    var tick      = 0;
    var _metricsEl = null;
    var _is2D = false;
    var _wvDemo = false; // r0/r1 unique-rational-wavelength demo toggle (REINIT-CLASS, like _is2D)

    window.__frqtlSphereEmitter = { activeQuanta: 0, R: 24, preset: 'spherical' };

    // THE SKETCH — world.init() FIRST, then CONSTRUCT parts. `setupSphereEmitter3D`
    // is a PART constructor and never inits; its exported `initWorld` is the world
    // step. `runner.setup(setupSphereEmitter3D, opts)` runs both in that order, so
    // every restart-in-place (is2D / lambda-demo) re-runs the world step too.

    // Read every CURRENT-DOM control value that must survive a REINIT-CLASS
    // restart (is2D toggle OR wvdemo toggle) — ONE authority, reused by both
    // restart call sites (restart-in-place: re-apply from DOM, never a second
    // shadow state — reference_restart_in_place_reapply_from_dom_not_shadow_state.md).
    function _currentReinitOptions() {
        return {
            R: parseFloat(document.getElementById('ctrl-R').value),
            emissionBoxSide: parseFloat(document.getElementById('ctrl-emissionBoxSide').value),
            preset: document.getElementById('ctrl-preset').value,
            mode: document.getElementById('ctrl-mode').value,
            burstSize: parseFloat(document.getElementById('ctrl-burstSize').value),
            emitEveryTicks: parseFloat(document.getElementById('ctrl-emitEveryTicks').value),
            fundamentalDimension: _wvDemo ? setupSphereEmitter3D.WAVELENGTH_DEMO_DIMENSION : 0,
            wavelength: parseFloat(document.getElementById('ctrl-wavelength').value)
        };
    }

    // Sync the wavelength slider's max (dynamic — depends on the CURRENT
    // fundamentalDimension, unlike every other control's static max) + its
    // enabled state to the live control (mirrors tunnel-lab/lightsource-lab's
    // own `sliderWl.max = setupTunnelLab.MAX_USEFUL_WAVELENGTH` idiom, except
    // this page's ceiling is RUNTIME-variable — 1 (demo off) or 16 (demo on)
    // — so it must be re-applied on every restart, not just once at boot).
    function _syncWavelengthSlider(ctl) {
        var el = document.getElementById('ctrl-wavelength');
        var lbl = document.getElementById('ctrl-wavelength-val');
        el.max = String(ctl.getMaxWavelength());
        el.disabled = !_wvDemo;
        el.value = String(ctl.getWavelength());
        lbl.textContent = String(ctl.getWavelength());
    }

    // Reflect the camera provider's CURRENT orbit into the slider row (single
    // source of truth = cam.getOrbit()) — shared by the initial setup AND the
    // is2D restart handler so both call sites stay in sync, never duplicated.
    function _syncCameraSliders(cam) {
        var o = cam.getOrbit();
        var azEl = document.getElementById('cam-azimuth');
        var elEl = document.getElementById('cam-elevation');
        var diEl = document.getElementById('cam-distance');
        azEl.value = Math.round(o.azimuth);   document.getElementById('cam-azimuth-val').textContent   = azEl.value;
        elEl.value = Math.round(o.elevation); document.getElementById('cam-elevation-val').textContent = elEl.value;
        diEl.value = Math.round(o.distance);  document.getElementById('cam-distance-val').textContent  = diEl.value;
    }

    // Flat-2D presentation (CEO Phase 1 iteration, 2026-07-18): in 2D mode the
    // scene must render FLAT — x maps unmirrored to screen-right, y (physics
    // y-down) maps to screen-down, exactly like the old flat p5 2D canvas —
    // not a diagonally-projected 3D orbit. Verified via
    // `_orbitCameraBasis({azimuth:180,elevation:0}, W,H)` (pkg-node, three-
    // provider.js's own exported pure geometry helper): forward=(0,0,1),
    // right=(1,0,0), up=(0,-1,0) — a straight-on view of the x-y plane. None
    // of the 3 named presets (down-barrel/table-top/rooftop) is this exact
    // orbit (table-top's azimuth=0 is the SAME flat geometry but MIRRORED in
    // x) — composed directly via the existing `setOrbit` primitive, no new
    // renderer code. 3D mode is unchanged (still defaults to 'rooftop').
    // Called on EVERY (re)setup so toggling is2D always re-derives the
    // correct default from CURRENT _is2D, never an incremental adjustment.
    function _applyDefaultCameraOrbit() {
        var cam = runner.cameraControl;
        if (!window.OrbitBag.hasAngularPose(cam)) { return; }   // an orbit framing needs an angular camera
        if (_is2D) {
            cam.setOrbit({ azimuth: 180, elevation: 0, distance: 600 * 1.30 });
        } else {
            cam.setPreset('rooftop');
            cam.setOrbit({ distance: 1400 });
        }
        _syncCameraSliders(cam);
    }

    // Generic "re-sync every slider from authoritative state" (CEO fix, 2026-07-18 —
    // "the clamp bug"). setR() can shrink R below an ALREADY-set emissionBoxSide, and
    // the sugar factory re-clamps emissionBoxSide internally when that happens — but a
    // slider dragged for one control never automatically reflects a clamp that fired
    // on a DIFFERENT control's state. Calling this after EVERY onChange keeps every
    // slider (value, label, and any maxRef-linked `max` attribute) truthful to the
    // control's own `get()` accessor — the SAME authority the physics reads — instead
    // of the raw last-dragged DOM value.
    function _resyncAllControls(CONTROLS) {
        CONTROLS.forEach(function (c) {
            if (typeof c.get !== 'function') return;
            var el = document.getElementById('ctrl-' + c.id);
            if (!el) return;
            var v = c.get();
            if (c.kind === 'select') {
                el.value = v;
            } else {
                if (c.maxRef) {
                    var refCtrl = CONTROLS.filter(function (o) { return o.id === c.maxRef; })[0];
                    if (refCtrl && typeof refCtrl.get === 'function') { el.max = refCtrl.get(); }
                }
                el.value = v;
                var out = document.getElementById('ctrl-' + c.id + '-val');
                if (out) out.textContent = c.fmt(v);
            }
        });
    }

    function buildAndWireControls(ctl) {
        var CONTROLS = ctl.controls;
        CONTROLS.forEach(function (c) {
            var el = document.getElementById('ctrl-' + c.id);
            if (!el) return;
            if (c.kind === 'select') {
                el.value = c.value;
                el.addEventListener('change', function () {
                    c.onChange(el.value);
                    _resyncAllControls(CONTROLS); // e.g. switching preset may re-derive ranges
                });
            } else {
                var out = document.getElementById('ctrl-' + c.id + '-val');
                if (c.maxRef) {
                    var refCtrl0 = CONTROLS.filter(function (o) { return o.id === c.maxRef; })[0];
                    if (refCtrl0 && typeof refCtrl0.get === 'function') { el.max = refCtrl0.get(); }
                }
                el.value = c.value;
                if (out) out.textContent = c.fmt(c.value);
                el.addEventListener('input', function () {
                    var v = parseFloat(el.value);
                    if (out) out.textContent = c.fmt(v);
                    c.onChange(v);
                    // The AUTHORITATIVE post-clamp value may differ from the raw slider
                    // reading (e.g. dragging R down re-clamps emissionBoxSide) — resync
                    // EVERY slider (including this one) from the control's own get().
                    _resyncAllControls(CONTROLS);
                });
            }
        });
        _resyncAllControls(CONTROLS); // initial pass: apply maxRef bounds before first interaction
        runner.experimentControls = CONTROLS; // forward-compat (camera excepted, host-side
                                               // duplicate strip was dropped — see
                                               // reference_gym_chrome_canvas_dropped_ruling.md)
    }

    window.setup = function () {
        _metricsEl = document.getElementById('sphere-emitter-metrics');

        runner = new FrqtlApp({
            is3D: true,   // a 3D page: perspective + depth (handed to the provider's init)
            canvasParentId: 'canvas-wrapper',
            canvasW: 600,
            canvasH: 600,
            seed: 42,
            onTick: function (tickData) {
                tick++;
                var frames = tickData && tickData.frameData ? tickData.frameData : [];
                var count = frames.length;

                if (_metricsEl) {
                    _metricsEl.setAttribute('data-active-quanta', count);
                    var ctl = runner.setupResult && runner.setupResult.sphereEmitterControl;
                    if (ctl) {
                        _metricsEl.setAttribute('data-r', ctl.getR());
                        _metricsEl.setAttribute('data-preset', ctl.getPreset());
                        _metricsEl.setAttribute('data-source-shape', ctl.getSourceShape());
                        _metricsEl.setAttribute('data-wavelength', ctl.getWavelength());
                        _metricsEl.setAttribute('data-max-wavelength', ctl.getMaxWavelength());
                        _metricsEl.setAttribute('data-fundamental-dimension', ctl.getFundamentalDimension());
                    }
                }
                window.__frqtlSphereEmitter.activeQuanta = count;

                if (metrics) {
                    metrics.update({ 'Active Quanta': count, 'Tick': tick });
                }
            }
        });

        runner.createCanvas();
        runner.setup(setupSphereEmitter3D, Object.assign({ is2D: _is2D }, _currentReinitOptions()));

        var ctl = runner.setupResult.sphereEmitterControl;
        window.__frqtlSphereEmitter.R = ctl.getR();
        window.__frqtlSphereEmitter.preset = ctl.getPreset();

        metrics = new ExperimentMetrics('metrics-panel', [
            { name: 'Active Quanta', expected: null, format: function (v) { return String(Math.round(v)); } },
            { name: 'Tick',          expected: null, format: function (v) { return String(v); } }
        ]);

        document.getElementById('ctrl-autofire').addEventListener('change', function (e) {
            ctl.setActive(e.target.checked);
        });

        buildAndWireControls(ctl);
        _syncWavelengthSlider(ctl);

        // ── &lambda; demo toggle — restart-in-place (fundamentalDimension is
        //    fixed at universe.init() time, exactly like is2D below; re-run
        //    the SAME runner.setup() loop-reset idiom with the opposite
        //    fundamentalDimension). ─────────────────────────────────────────
        document.getElementById('ctrl-wvdemo').addEventListener('change', function (e) {
            _wvDemo = !!e.target.checked;
            var prevActive = document.getElementById('ctrl-autofire').checked;
            runner.setup(setupSphereEmitter3D, Object.assign({ is2D: _is2D }, _currentReinitOptions()));
            var newCtl = runner.setupResult.sphereEmitterControl;
            newCtl.setActive(prevActive);
            buildAndWireControls(newCtl);
            _syncWavelengthSlider(newCtl);
        });

        // ── 2D/3D toggle — restart-in-place (activeAxes.z is fixed at
        //    universe.init() time; re-run the SAME runner.setup() loop-reset
        //    idiom with the opposite is2D flag — mirrors the documented
        //    "rebuild via runner.setup(), re-apply every control from its
        //    CURRENT DOM value" pattern). ───────────────────────────────────
        document.getElementById('ctrl-is2D').addEventListener('change', function (e) {
            _is2D = !!e.target.checked;
            var prevActive = document.getElementById('ctrl-autofire').checked;
            runner.setup(setupSphereEmitter3D, Object.assign({ is2D: _is2D }, _currentReinitOptions()));
            var newCtl = runner.setupResult.sphereEmitterControl;
            newCtl.setActive(prevActive);
            buildAndWireControls(newCtl);
            _syncWavelengthSlider(newCtl);
            _applyDefaultCameraOrbit(); // re-derive flat-2D vs rooftop from the NEW _is2D
        });

        // ── Camera orbit control (sugar handle — mirrors cone-emitter-3d) ──
        var cam = runner.cameraControl;
        if (window.OrbitBag.hasAngularPose(cam)) {   // az/el sliders: an angular camera only
            document.getElementById('camera-controls').style.display = 'inline-flex';

            // Default orbit for the CURRENT mode: flat straight-on for 2D
            // (see _applyDefaultCameraOrbit's docs above), 'rooftop' 3/4
            // aerial for 3D (shows the sun's full volumetric extent from the
            // first frame — rotating around it via down-barrel/table-top
            // lets the CEO confirm it looks round from every angle).
            _applyDefaultCameraOrbit();

            var azEl = document.getElementById('cam-azimuth');
            var elEl = document.getElementById('cam-elevation');
            var diEl = document.getElementById('cam-distance');
            function _wireOrbit(inputEl, labelId, key) {
                inputEl.addEventListener('input', function () {
                    var v = parseInt(inputEl.value, 10);
                    document.getElementById(labelId).textContent = v;
                    var spec = {}; spec[key] = v;
                    cam.setOrbit(spec);
                });
            }
            _wireOrbit(azEl, 'cam-azimuth-val',   'azimuth');
            _wireOrbit(elEl, 'cam-elevation-val', 'elevation');
            _wireOrbit(diEl, 'cam-distance-val',  'distance');

            (cam.presets || []).forEach(function (name) {
                var btn = document.getElementById('cam-preset-' + name);
                if (btn) { btn.addEventListener('click', function () { cam.setPreset(name); _syncCameraSliders(cam); }); }
            });

            runner.setRateLimits({ fpsLimit: 0, tpsLimit: 120 });
        }

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 on the p5 renderer (its load calls
    // window.setup), else window.setup() (FRAQTL #74).
    window._egptStartSketch();
    </script>
</body>
