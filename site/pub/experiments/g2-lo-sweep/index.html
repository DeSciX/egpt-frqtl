<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EGPT — G2: a moving LO sweeps a field</title>
    <link rel="stylesheet" href="../../5d0c22f5/experiments/_shared/experiment-layout.css">
    <style>
        .experiment-controls {
            flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
            padding: 6px 12px; background: #0d0d0d; border-top: 1px solid #2a2a2a; flex-wrap: wrap;
        }
        .experiment-controls label { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .experiment-controls input[type="range"] { width: 140px; cursor: pointer; accent-color: #ff7850; }
        .experiment-controls span.val { color: #ff7850; min-width: 32px; display: inline-block; text-align: right; }
        #reset { background:#27424f; color:#7ec8e3; border:1px solid #7ec8e3; border-radius:3px; font-size:12px; padding:3px 12px; cursor:pointer; }
        .legend { color:#888; font-size:11px; }
        .legend b.t { color:#5a96dc; } .legend b.lo { color:#ff7850; }
    </style>
</head>
<body>
    <script>window._egptDefaultEngine = "wasm";
    window._egptEnginePathMap = {"assets/vendor/":"../../5d0c22f5/js/lib/","assets/render/":"../../5d0c22f5/js/consumers/","assets/models/":"../../5d0c22f5/js/models/","compat/providers/":"../../5d0c22f5/js/compat/","compat/":"../../5d0c22f5/js/compat/","objects/":"../../5d0c22f5/js/game/","experiments/_shared/":"../../5d0c22f5/experiments/_shared/","experiments/":"../../5d0c22f5/experiments/","scenes/":"../../5d0c22f5/scenes/","shim/":"../../5d0c22f5/ide/"};</script>
    <script>window._egptWasmPkgUrl = new URL("../../5d0c22f5/fat/pkg-web/egpt_wasm.js", document.baseURI).href;</script>

    <!-- UNIT-TEST G2: "an LO extends Frame" by composition.
         A LargeObject is linked to a moving backing frame (setLargeObjectFrame) so it MOVES via
         the move pass + speed_prob gate; its search rect (larger than the 1px body) sweeps a
         field of stationary targets and its ABSORB trigger clears them. -->
    <script src="../../5d0c22f5/experiments/_shared/stack-boot.js"
        data-page-scripts="
            ../../5d0c22f5/js/game/setup/setupG2Sweep.js,
            ../../5d0c22f5/experiments/_shared/experiment-metrics.js
        "></script>

    <div class="experiment-container">
        <div class="experiment-canvas" id="canvas-wrapper"></div>
        <div class="experiment-controls">
            <button type="button" id="reset" title="Restart the sweep">↺ Reset</button>
            <label title="Speed probability of the LO's backing frame (frame.speed_prob)">
                LO speed_prob:
                <input type="range" id="ctrl-sp" min="0.1" max="1" step="0.05" value="0.6">
                <span class="val" id="ctrl-sp-val">0.60</span>
            </label>
            <span class="legend"><b class="t">●</b> stationary targets &nbsp; <b class="lo">▮</b> moving LO (rect &gt; body)</span>
        </div>
        <div id="metrics-panel"></div>
    </div>

    <script>
    /* Copyright 2023-2026 by Essam Abadir */
    var runner = null, metrics = null, tick = 0, startTargets = 0;

    window.setup = function () {
        runner = new FrqtlApp({
            canvasParentId: 'canvas-wrapper',
            canvasW: 600, canvasH: 600, seed: 42,
            onTick: function (tickData) {
                tick++;
                var res = runner.setupResult || {};
                var fd = (tickData && tickData.frameData) ? tickData.frameData : [];
                // Sync the RENDERED LO box to its moving backing frame (engine already syncs
                // its own collision rect; this mirrors the position into the JS wrapper rect).
                var body = fd.find(function (f) { return f.id === res.bodyQid; });
                if (body && res.lo) {
                    var bx = body.rect ? body.rect._x : body.x;
                    var by = body.rect ? body.rect._y : body.y;
                    res.lo.rect.left = bx - res.searchW / 2;
                    res.lo.rect.top  = by - res.searchH / 2;
                }
                var remaining = Math.max(0, fd.length - (body ? 1 : 0));
                if (metrics) {
                    metrics.update({
                        'Tick': tick,
                        'LO x': body ? (body.rect ? body.rect._x : body.x) : 0,
                        'Targets left': remaining,
                        'Absorbed': startTargets - remaining
                    });
                }
            }
        });
        runner.createCanvas();
        runner.setup(setupG2Sweep, { speedProb: 0.6 });
        startTargets = (runner.setupResult && runner.setupResult.targets) || 0;

        metrics = new ExperimentMetrics('metrics-panel', [
            { name: 'Tick',         expected: null, format: function (v) { return String(v); } },
            { name: 'LO x',         expected: null, format: function (v) { return v.toFixed(0) + ' px'; } },
            { name: 'Targets left', expected: null, format: function (v) { return String(Math.round(v)); } },
            { name: 'Absorbed',     expected: null, format: function (v) { return String(Math.round(v)); } }
        ]);

        var sp = document.getElementById('ctrl-sp'), spVal = document.getElementById('ctrl-sp-val');
        sp.addEventListener('input', function () {
            var v = parseFloat(sp.value);
            spVal.textContent = v.toFixed(2);
            if (runner.universe && runner.setupResult) {
                runner.universe.setFrameProperty(runner.setupResult.bodyQid, 'speed_prob', v);
            }
        });

        runner.start();
        if (typeof frameRate === 'function') { frameRate(60); }
        window._frqtlApp = runner;
    };

    document.getElementById('reset').addEventListener('click', function () { window.location.reload(); });

    // Boot — the ONE dance stack-boot.js owns: engine → renderer → the stack-complete
    // promise (every data-page-scripts entry) → p5 (its load calls
    // window.setup) on every renderer (FRAQTL #74).
    window._egptStartSketch({ p5: 'always' });
    </script>
</body>
</html>
