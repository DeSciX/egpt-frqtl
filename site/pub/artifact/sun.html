<!DOCTYPE html>
<!-- Copyright 2023-2026 by Essam Abadir -->
<!-- FRQTL — bootScene self-contained scene page (a spherical "sun").
     Authored at sdk/frqtl-sdk/src/artifact/sun.html; copied VERBATIM to
     dist/artifact/sun.html by sdk/frqtl-sdk/build.js (build is the sole writer
     of dist/ — this file is the authored source).

     Unlike the CDN-pinned double-slit.html (generated by artifact-shell.js so its
     jsdelivr import map can never drift from CDN_BASE), THIS page uses a PAGE-
     RELATIVE base: it loads the ESM entry + every injected engine/renderer/game
     script from the SAME dist it is served out of (no CDN, no dynamic mirror
     port). Served by frqtl-server at /pub_sdk/frqtl-sdk/artifact/sun.html, the
     dist root is one level up ("../"), so bootScene({ base }) re-anchors every
     injected URL there. This is the generic-scene counterpart of the double-slit
     showcase: it boots ANY setup factory by NAME (here setupSphereEmitter3D). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRQTL — Sun (bootScene / setupSphereEmitter3D)</title>
<style>
  html,body{margin:0;padding:0;background:#050507;color:#c9c9c9;font-family:ui-monospace,Menlo,Consolas,monospace;}
  #frqtl-status{text-align:center;font-size:12px;color:#888;padding:10px 0 4px;}
  #frqtl-mount{width:480px;height:504px;margin:0 auto 24px;position:relative;}
</style>
</head>
<body>
<div id="frqtl-status" data-role="frqtl-scene-status">booting FRQTL sun…</div>
<div id="frqtl-mount" data-role="frqtl-scene-mount"></div>
<!-- The ESM entry resolves page-relative to this dist's own copy. -->
<script type="importmap">{"imports":{"@descix/frqtl-sdk":"../esm/index.js"}}</script>
<script type="module">
  import { bootScene } from '@descix/frqtl-sdk';

  // Page-relative dist root (one level up from /artifact/), no trailing slash —
  // engineRouter({mode:'cdn', base}) joins base + '/js/...', so a trailing '/'
  // would double up. This is the local-serve analogue of the CDN mirror's
  // LOCAL_CDN_BASE override — every injected URL re-anchors HERE, not at jsdelivr.
  var distRoot = new URL('..', location.href).href.replace(/\/$/, '');

  var statusEl = document.getElementById('frqtl-status');
  var tickCount = 0;

  bootScene('frqtl-mount', 'setupSphereEmitter3D', {
    base: distRoot,
    preset: 'spherical',
    emissionBoxSide: 0,
    is2D: false,
    chargeMode: 'random',
    fundamentalDimension: 2,
    canvasSize: 480,
    seed: 42,
    render: { shape: 'sphere', godrays: 0.8, glowIntensity: 1.6 },
    onTick: function (tickData, setupResult) {
      tickCount++;
      if (tickCount % 20 === 0) {
        statusEl.textContent = 'FRQTL sun — live — tick ' + tickCount;
      }
    }
  }).then(function (scene) {
    statusEl.textContent = 'FRQTL sun — live';
    // Expose for realm assertions (Playwright): tweak render options live.
    window.__frqtlScene = scene;
  }).catch(function (err) {
    statusEl.textContent = 'FRQTL sun boot FAILED — see overlay below.';
    if (window.console && console.error) { console.error('[frqtl-sun]', err); }
  });
</script>
</body>
</html>
