<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>egpt-frqtl shell harness</title>
<style>html,body{margin:0;height:100%;background:#111}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<script>
// Test fixture for scripts/test/host-view.mjs — NEVER part of the published site (it lives outside
// site/, so neither the assembly nor the upload allowlist can reach it).
//
// It stands in for the DeSciX App Shell's BUS, never for the SDK: the framed page loads the REAL
// vendored site/DeSciXAppSDK.js, which walks up and finds this window's `DeSciX` because only the
// owner publishes `bridge.version` (DeSciXAppSDK.js busOn). `bridge.ready` + `bridge.members()`
// are the owner shape the SDK's ready() reads; without `ready` the SDK waits for an event a stub
// never fires. Precedent: egpt-godsworld site/shell-harness.html (owed: ONE shell-bus harness
// shipped by the platform; this copy is deleted when it lands).
//
//   ?page=<site page + query>   the page to frame, relative to /site/ (required)
//   ?listening=1|0              view.available() — a view-aware host (1) or a bare-iframe host (0)
//   ?bus=none                   publish NO bus: measures the SDK's embedded-no-bridge behavior
//
// Every view.set call is recorded in window.__viewSets. No page = loud failure; this never guesses.
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var page = q.get('page');
  if (!page) {
    document.body.textContent = 'shell-harness: pass ?page=<site page> (e.g. app.html?preset=author)';
    throw new Error('shell-harness: no page');
  }
  window.__viewSets = [];
  if (q.get('bus') !== 'none') {
    var listening = q.get('listening') === '1';
    window.DeSciX = {
      bridge: { version: 1, ready: true, members: function () { return ['view', 'chat', 'AppContext']; } },
      view: {
        available: function () { return listening; },
        set: function (mode) { window.__viewSets.push(mode); return mode; }
      },
      chat: { available: function () { return false; } },
      AppContext: { loginStatus: 'GUEST' }
    };
  }
  var f = document.createElement('iframe');
  f.src = '/site/' + page;
  f.title = 'Code Site';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
